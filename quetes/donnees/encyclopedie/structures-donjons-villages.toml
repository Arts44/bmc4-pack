titre = "&6Structures — donjons, villes et tours"
taille = 1.5
icone = "minecraft:bell"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Une quête par structure que le serveur génère vraiment : placée par la génération du monde, dans au moins un biome qui existe ici (outils/generation.py, datapacks du serveur compris). Elle se valide en &lentrant&r dans la structure ; quand le mod a un progrès de découverte, une visite d'avant le livre compte aussi. Les noms sont ceux du mod, entre guillemets.
"""

