icone = "minecraft:grass_block"
ordre = 0
lignes_cachees = true
grille = 16

[[quete]]
cle = "intro"
titre = "&2Biomes — Overworld"
taille = 1.5
icone = "minecraft:grass_block"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Chaque biome de l'Overworld que le serveur génère : le jeu de base, Biomes O' Plenty, les grottes de YUNG's et de Galosphere, les rivières de Climate Rivers, le Glimmering Weald de Quark. Une quête se valide en &lentrant&r dans le biome.

Seuls les biomes que les configs du serveur laissent générer sont là (outils/generation.py).
"""

