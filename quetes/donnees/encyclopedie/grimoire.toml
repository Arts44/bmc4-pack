[[quete]]
cle = "intro"
titre = "&dGrimoire"
taille = 1.5
icone = "irons_spellbooks:scroll"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Chaque sort d'Iron's Spells qu'un parchemin peut porter sur ce serveur, une quête par sort. N'importe quel niveau compte : le niveau d'un parchemin trouvé est tiré au hasard, et l'enclume arcanique les fusionne. Une quête se valide en ayant le parchemin dans l'inventaire ; rien n'est consommé. Les paliers de la magie sont au chapitre &7Iron's Spells&r.
"""

