[chapitre]
titre = "&7Bestiaire — Overworld"
fichier = "enc_bestiaire_overworld"
groupe = "encyclopedie"
icone = "minecraft:zombie_head"
ordre = 0
lignes_cachees = true
grille = 16

[[quete]]
cle = "intro"
titre = "&7Bestiaire — Overworld"
taille = 1.5
icone = "minecraft:zombie_head"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Chaque créature de l'Overworld, du jeu de base et des mods de faune. Une quête se valide en &lregardant&r la créature : il suffit de l'avoir devant soi.

Chaque fiche dit ce que les données du pack disent : la catégorie d'apparition, le monde, les biomes, le butin — et, quand la créature ne vient pas d'un biome, la voie qui la fait apparaître. Rien de plus.

Ce chapitre est facultatif, un catalogue à remplir au fil des rencontres. La dernière quête récompense le bestiaire complet.
"""

