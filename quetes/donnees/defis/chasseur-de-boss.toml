# Chapitre « Chasseur de boss » — cahier des charges §7.1
# Tout optionnel, hexagone, récompenses S (XP) uniquement.
# La liste est celle de boss.js du bot (discord-factions, lue le 5 octobre
# 2026) pour rester cohérente avec #faits-d-armes : 38 entrées, chacune
# meurt en UNE entité. Le Shelterer compte sur sa seconde forme
# (shelterer_without_armor), comme le bot. Les Chevaliers fantômes sont
# six : hors de la liste du bot, ici en « tuer 6 ». L'Œil de la Tempête
# (Deep Aether), le Berserker et le Ver du vide ne sont pas dans boss.js :
# ajoutés en fin de tableau, signalés comme tels.

[chapitre]
titre = "&cChasseur de boss"
fichier = "defis_chasseur_de_boss"
groupe = "defis"
icone = "minecraft:wither_skeleton_skull"
ordre = 1
lignes_cachees = true

[[quete]]
cle = "intro"
titre = "&cLe tableau de chasse"
sous_titre = "Chaque mort est annoncée dans #faits-d-armes."
taille = 1.5
icone = "minecraft:netherite_sword"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Un hexagone par boss du serveur, dans l'ordre du bot. Tout est optionnel et ne compte pas dans le pourcentage. Les quêtes de boss des chapitres du Monde restent le guide ; ici, c'est le compte.
"""

