# Chapitre « Collectionneur » — cahier des charges §7.3
# Tout optionnel, hexagone, récompenses S (XP). Identifiants de l'index :
# les six essences de palier de Mystical Agriculture (inferium, prudentium,
# tertium, imperium, supremium, awakened supremium), les neuf trophées de
# la Twilight Forest, les seize disques vanilla, les neuf de Cataclysm, les
# neuf de la Twilight Forest, les seize modèles d'ornement vanilla, les
# vingt tessons, les armures de boss (ignitium, cursium, Warden, dragon,
# ardente, métal de chevalier, Wroughtnaut, chorundum). Les races de
# dragons : l'œuf n'est pas un objet de l'index (NBT), case à cocher.

[chapitre]
titre = "&6Collectionneur"
fichier = "defis_collectionneur"
groupe = "defis"
icone = "minecraft:chest"
ordre = 3
lignes_cachees = true

[[quete]]
cle = "intro"
titre = "&6Tout avoir"
taille = 1.5
icone = "minecraft:ender_chest"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Des séries complètes. Rien n'est consommé : montrer l'objet suffit. Tout est optionnel et hors pourcentage.
"""

[[quete]]
cle = "essences"
titre = "Les six essences"
deps = ["intro"]
optionnel = true
taille = 1.3
taches = ["item mysticalagriculture:inferium_essence", "item mysticalagriculture:prudentium_essence", "item mysticalagriculture:tertium_essence", "item mysticalagriculture:imperium_essence", "item mysticalagriculture:supremium_essence", "item mysticalagriculture:awakened_supremium_essence"]
recompenses = ["xp 30"]
description = """
Inferium, prudentium, tertium, imperium, supremium, supremium éveillé.
"""

[[quete]]
cle = "trophees"
titre = "Les neuf trophées"
deps = ["intro"]
optionnel = true
taille = 1.3
taches = ["item twilightforest:naga_trophy", "item twilightforest:lich_trophy", "item twilightforest:minoshroom_trophy", "item twilightforest:hydra_trophy", "item twilightforest:knight_phantom_trophy", "item twilightforest:ur_ghast_trophy", "item twilightforest:alpha_yeti_trophy", "item twilightforest:snow_queen_trophy", "item twilightforest:quest_ram_trophy"]
recompenses = ["xp 40"]
description = """
Les huit boss de la Twilight Forest et le Bélier des quêtes.
"""

[[quete]]
cle = "dragons"
titre = "Toutes les races de dragons"
deps = ["intro"]
optionnel = true
taille = 1.3
taches = ["checkmark Trente-six races vues chez moi"]
recompenses = ["xp 40"]
description = """
Trente-six races (chapitre &5Les dragons&r). L'œuf porte sa race en NBT : le livre ne peut pas le compter, la case est sur l'honneur et le Bestiaire fait foi.
"""

