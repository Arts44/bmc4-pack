# Chapitre « Contrats de la semaine » — cahier des charges §9.3
# Répétables, délai 7 jours. Vérifié dans le jar FTB Quests 2001.4.22
# (5 octobre 2026) : can_repeat est un booléen ; repeat_cooldown un entier
# en secondes, qui court depuis la RÉCLAMATION (TeamData : délai × 1000
# ajouté à l'heure de la réclamation). Un calage sur le dimanche 20 h du
# classement n'est donc pas possible : chaque contrat revient sept jours
# après avoir été réclamé.
# Une répétable n'a que des livraisons consommées (!consommer) et des
# tâches « tuer » : une statistique, un progrès ou un objet gardé en poche
# se revalideraient aussitôt (KillTask : entité exacte, pas de balise).
# La progression est celle de l'équipe FTB : en faction, le contrat est
# commun à la faction ; un indépendant le remplit seul.
# Récompenses : XP (R0) et un tirage de la table « Contrat » (pain,
# torches, poudre d'os, poulet cuit, flèches).

[chapitre]
titre = "&6Contrats de la semaine"
fichier = "semaine_contrats"
groupe = "semaine"
icone = "minecraft:writable_book"
ordre = 1

[[quete]]
cle = "intro"
titre = "&6Le tableau des contrats"
taille = 1.5
icone = "minecraft:writable_book"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Vingt contrats qui reviennent chaque semaine : livrer, chasser, ramener. Chacun se réclame une fois, puis revient &lsept jours après la réclamation&r. Les objets livrés sont &lretirés&r de l'inventaire. En faction, le contrat est commun : une livraison compte pour toute l'équipe.

La récompense est modeste, exprès : de l'expérience et un tirage de la table &6Contrat&r.
"""

