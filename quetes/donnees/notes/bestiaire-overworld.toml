# Textes spécifiques du Bestiaire — Overworld. Une entrée par identifiant
# d'entité ; tout le reste prend le modèle de son mod (outils/encyclopedie.py).
# Ces notes survivent à la régénération.

[note."alexsmobs:grizzly_bear"]
titre = "Rencontre : Grizzly"
description = "Neutre, dans les forêts et les montagnes. Il attaque si on s'approche de ses petits, et il monte aux arbres aussi vite que toi."

[note."mowziesmobs:frostmaw"]
titre = "Rencontre : Frostmaw"
description = "Un colosse endormi dans les biomes enneigés. Le réveiller sans préparation est une erreur : c'est un boss, et sa quête de combat est au chapitre Mowzie's Mobs."

[note."mowziesmobs:umvuthi"]
titre = "Rencontre : Umvuthi"
description = "L'oiseau-soleil, sur son trône au cœur d'un village Umvuthana dans la savane. On peut lui parler avant de le combattre : ses fidèles vendent des masques."

[note."mowziesmobs:wroughtnaut"]
titre = "Rencontre : Wroughtnaut ferreux"
description = "Un chevalier de fer immobile dans une salle souterraine. Il ne bouge que si on entre, et son armure ne cède que par derrière."

[note."mowziesmobs:sculptor"]
titre = "Rencontre : Sculpteur"
description = "Tongbi, dans un monastère des pics gelés. Il propose une épreuve d'escalade plutôt qu'un combat."

[note."conjurer_illager:conjurer"]
titre = "Rencontre : Conjurateur"
description = "Il tient un théâtre dans les forêts de chênes noirs. Illusions, lapins explosifs, cartes : un spectacle qu'on finit à l'épée."
apparition = "sur la scène de son théâtre"

[note."illagerinvasion:invoker"]
titre = "Rencontre : Invoker"
description = "Le maître des illageois, dernière vague des raids de village. Un boss : sa mort est annoncée dans #faits-d-armes, et sa quête de combat est dans le chapitre Donjons et autres boss."
apparition = "dans les raids de village, en dernière vague"

[note."minecraft:warden"]
titre = "Rencontre : Warden"
description = "Aveugle, dans les cités anciennes des profondeurs. Il entend tout ; marcher accroupi et poser de la laine est la seule façon de passer. Le fuir vaut mieux que l'affronter."
apparition = "dans les cités anciennes, appelé par un hurleur de sculk déclenché trois fois"

[note."goblintraders:goblin_trader"]
titre = "Rencontre : marchand gobelin"
description = "Dans les grottes, un petit marchand qui vend des enchantements et des potions rares contre de l'émeraude et quelques objets. Son cousin des veines vit plus profond."
apparition = "près des joueurs, sous Y 50, une chance sur quatre toutes les dix minutes ; il repart au bout d'un jour"

[note."friendsandfoes:copper_golem"]
titre = "Rencontre : golem de cuivre"
description = "Un golem qu'on fabrique : bloc de cuivre et paratonnerre. Il appuie sur les boutons de cuivre, et il s'oxyde avec le temps. Du miel le fige."
apparition = "dans les villages et les cités anciennes, ou construit : bloc de cuivre et paratonnerre"

[note."guardvillagers:guard"]
titre = "Rencontre : garde villageois"
description = "Les villages ont des gardes armés. Ils défendent les villageois contre les pillards, et contre toi si tu frappes un villageois sous leurs yeux."

