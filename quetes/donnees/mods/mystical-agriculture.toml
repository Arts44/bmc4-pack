titre = "L'amélioration de tertium"
deps = ["tertium", "amelioration_prudentium"]
optionnel = true
taches = ["item mysticalagriculture:tertium_upgrade"]
recompenses = ["xp 7"]
description = """
Quatre essences et quatre lingots de tertium autour de l'amélioration d'avant (celle de prudentium). Posée dans une machine du mod, elle la fait travailler plus vite, et consommer plus vite.
"""

[[quete]]
cle = "armure_imperium"
titre = "L'armure d'imperium"
deps = ["imperium", "armure_tertium"]
optionnel = true
taches = ["item mysticalagriculture:imperium_helmet", "item mysticalagriculture:imperium_chestplate", "item mysticalagriculture:imperium_leggings", "item mysticalagriculture:imperium_boots"]
