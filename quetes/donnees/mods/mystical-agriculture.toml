# Chapitre « Mystical Agriculture » — cahier des charges §5.4
# Recettes lues dans MysticalAgriculture-1.20.1-7.0.24.jar et config
# mysticalagriculture-common.toml du serveur (5 octobre 2026).

[chapitre]
titre = "&aMystical Agriculture"
fichier = "mystical_agriculture"
groupe = "mods"
icone = "mysticalagriculture:inferium_essence"
ordre = 3

[[quete]]
cle = "intro"
titre = "&aCultiver des ressources"
sous_titre = "Guide dans #mystical-agriculture sur le Discord."
taille = 1.5
icone = "mysticalagriculture:inferium_seeds"
taches = ["checkmark Lu"]
recompenses = ["item mysticalagriculture:mystical_fertilizer 4", "item minecraft:bone_meal 16"]
description = """
&aMystical Agriculture&r fait pousser le fer, le diamant, la nétherite : une graine par ressource, et des champs qui remplacent la mine. Tout part de deux minerais, la &dprospérité&r et l'&ainferium&r, et de cinq paliers d'essence qui se fabriquent les uns à partir des autres.

L'engrais mystique offert fait pousser n'importe quelle culture d'un coup. Garde-le pour les premières graines d'essence.
"""

[[quete]]
cle = "prosperite"
titre = "Des éclats de prospérité"
racine = true
taches = ["item mysticalagriculture:prosperity_shard 16"]
recompenses = ["xp 3"]
description = """
Le &dminerai de prospérité&r se mine dans la pierre et donne des éclats. Ils entrent dans la base de graine, le cristal d'infusion et les lingots de prospérité : c'est la monnaie du mod.
"""

[[quete]]
cle = "inferium"
titre = "De l'essence d'inferium"
racine = true
taches = ["item mysticalagriculture:inferium_essence 16"]
recompenses = ["xp 3"]
description = """
Le &aminerai d'inferium&r se mine comme le charbon. Son essence est le premier palier : tout ce qui suit en consomme, et les champs d'inferium en produiront bien plus que la mine.
"""

[[quete]]
cle = "graines_inferium"
titre = "Des graines d'inferium"
deps = ["inferium"]
taille = 1.3
taches = ["item mysticalagriculture:inferium_seeds 4"]
recompenses = ["xp 5"]
description = """
Huit essences d'inferium autour de graines de blé. Plantées, elles donnent de l'inferium à chaque récolte et se replantent : c'est la première culture qui rapporte, et la seule qui se fabrique sans autel.
"""

[[quete]]
cle = "terre"
titre = "De la terre d'essence"
deps = ["graines_inferium"]
taches = ["item mysticalagriculture:inferium_farmland 8"]
recompenses = ["xp 3"]
description = """
Une essence d'inferium et une terre labourée, à la table ou d'un clic droit sur le champ. La &aterre d'inferium&r fait pousser plus vite ; chaque palier d'essence a la sienne, plus rapide encore.
"""

[[quete]]
cle = "cristal"
titre = "Un cristal d'infusion"
deps = ["prosperite", "inferium"]
taches = ["item mysticalagriculture:infusion_crystal"]
recompenses = ["xp 5"]
description = """
Un diamant au centre, quatre éclats de prospérité et quatre essences d'inferium. Le &bcristal d'infusion&r est l'outil qui fait monter l'essence de palier ; il s'use, et le cristal maître, en supremium, ne s'use plus.
"""

[[quete]]
cle = "prudentium"
titre = "Du prudentium"
deps = ["cristal"]
taches = ["item mysticalagriculture:prudentium_essence 8"]
recompenses = ["xp 5"]
description = """
Quatre essences d'inferium autour du cristal d'infusion : une essence de &2prudentium&r. C'est la règle de tous les paliers : quatre du palier d'avant, et le cristal.
"""

[[quete]]
cle = "tertium"
titre = "Du tertium"
deps = ["prudentium"]
taches = ["item mysticalagriculture:tertium_essence 8"]
recompenses = ["xp 5"]
description = """
Quatre prudentium et le cristal. Le &6tertium&r ouvre les cultures du milieu : or, redstone, et les premiers outils sérieux.
"""

[[quete]]
cle = "imperium"
titre = "De l'imperium"
deps = ["tertium"]
taches = ["item mysticalagriculture:imperium_essence 8"]
recompenses = ["xp 5"]
description = """
Quatre tertium et le cristal. L'&bimperium&r, c'est le diamant et l'émeraude en culture.
"""

[[quete]]
cle = "supremium"
titre = "Du supremium"
deps = ["imperium"]
taille = 1.3
taches = ["item mysticalagriculture:supremium_essence 8"]
recompenses = ["xp 8"]
description = """
Quatre imperium et le cristal. Le &csupremium&r est le dernier palier ordinaire : nétherite, outils et armure de supremium, cristal maître. Au-delà, il y a l'éveil.
"""

[[quete]]
cle = "autel"
titre = "L'autel d'infusion"
deps = ["prosperite"]
taille = 1.3
taches = ["item mysticalagriculture:infusion_altar", "item mysticalagriculture:infusion_pedestal 8"]
recompenses = ["xp 8"]
description = """
Lingots d'or, laine rouge et pierre : un &bautel&r et huit &bpiédestaux&r, de la même recette moins une pierre. Posés en cercle autour de l'autel, ils reçoivent les ingrédients ; un clic sur l'autel lance l'infusion. C'est là que naissent toutes les graines de ressources.
"""

[[quete]]
cle = "base"
titre = "Des bases de graine"
deps = ["prosperite"]
taches = ["item mysticalagriculture:prosperity_seed_base 4"]
recompenses = ["xp 3"]
description = """
Quatre éclats de prospérité autour de graines de blé. La &dbase de graine&r va au centre de l'autel : les piédestaux autour reçoivent l'essence du palier et le matériau à cultiver, en alternance.
"""

[[quete]]
cle = "bois"
titre = "Cultiver du bois"
deps = ["autel", "base", "graines_inferium"]
taches = ["item mysticalagriculture:wood_seeds"]
recompenses = ["xp 5"]
description = """
Première infusion : la base de graine, de l'essence d'inferium et du bois sur les piédestaux. Les &agraines de bois&r sont du premier palier, comme la terre et la pierre.
"""

[[quete]]
cle = "pierre"
titre = "Cultiver de la pierre"
deps = ["bois"]
taches = ["item mysticalagriculture:stone_seeds"]
recompenses = ["xp 3"]
description = """
Même infusion, avec de la pierre. Les cultures de premier palier ne demandent que de l'inferium.
"""

[[quete]]
cle = "fer"
titre = "Cultiver du fer"
deps = ["bois", "prudentium"]
taches = ["item mysticalagriculture:iron_seeds"]
recompenses = ["xp 5"]
description = """
Le fer est du deuxième palier : essence de &2prudentium&r et lingots de fer sur les piédestaux. Un champ de fer est la fin de la mine de fer.
"""

[[quete]]
cle = "or"
titre = "Cultiver de l'or"
deps = ["fer", "tertium"]
taches = ["item mysticalagriculture:gold_seeds"]
recompenses = ["xp 5"]
description = """
Troisième palier : &6tertium&r et lingots d'or.
"""

[[quete]]
cle = "diamant"
titre = "Cultiver du diamant"
deps = ["or", "imperium"]
taches = ["item mysticalagriculture:diamond_seeds"]
recompenses = ["xp 8"]
description = """
Quatrième palier : &bimperium&r et diamants. Le champ paiera les diamants mis à l'infusion, puis tous les suivants.
"""

[[quete]]
cle = "netherite"
titre = "Des graines de nétherite"
deps = ["diamant", "supremium"]
boss = true
forme = "diamond"
taches = ["item mysticalagriculture:netherite_seeds"]
recompenses = ["xp 10"]
description = """
Cinquième palier : &csupremium&r et lingots de nétherite, en alternance sur les piédestaux. Ce que le Nether rendait au compte-gouttes pousse dans un champ. La nétherite ne se donne pas en quête sur ce serveur ; ici, elle se cultive.
"""

[[quete]]
cle = "accelerateur"
titre = "Des accélérateurs de croissance"
deps = ["graines_inferium"]
taches = ["item mysticalagriculture:inferium_growth_accelerator 3"]
recompenses = ["xp 3"]
description = """
Quatre essences d'inferium, quatre pierres, une gemme d'inferium au centre : trois &aaccélérateurs&r. Posés sous la terre d'essence, ils font pousser plus vite ; empilés, ils s'additionnent. Chaque palier a le sien.
"""

[[quete]]
cle = "moissonneuse"
titre = "Une moissonneuse"
deps = ["fer"]
taches = ["item mysticalagriculture:harvester"]
recompenses = ["xp 5"]
description = """
Lingots de fer, lingots de soulium, deux faux en diamant et un châssis de machine. La &bmoissonneuse&r récolte et replante devant elle, en continu. Elle brûle du combustible solide, garde une réserve d'énergie interne et accepte les améliorations de machine. Un signal de redstone l'arrête.
"""

[[quete]]
cle = "elements"
titre = "Les quatre éléments"
deps = ["autel"]
taches = ["item mysticalagriculture:air_seeds", "item mysticalagriculture:earth_seeds", "item mysticalagriculture:water_seeds", "item mysticalagriculture:fire_seeds"]
recompenses = ["xp 5"]
description = """
Air, terre, eau, feu : quatre cultures à part, infusées avec des &dagglomérats&r (une bouteille, du gravier, de la terre, de l'argile pour l'air). Leur essence ne sert qu'à une chose : l'éveil du supremium.
"""

[[quete]]
cle = "eveil"
titre = "L'autel d'éveil"
deps = ["supremium", "elements"]
taille = 1.3
taches = ["item mysticalagriculture:awakening_altar", "item mysticalagriculture:awakening_pedestal 4", "item mysticalagriculture:essence_vessel 4"]
recompenses = ["xp 8"]
description = """
Autel et piédestaux en pierre d'âme, laine orange et or, plus quatre &brécipients d'essence&r (or, verre, pierre d'âme) qui tiennent chacun quarante essences d'un élément. L'autel montre où poser le reste, et un signal de redstone le lance. Un bloc de supremium, quatre poussières cognizantes et dix essences de chaque élément deviennent un &lbloc de supremium éveillé&r.
"""

[[quete]]
cle = "eveille"
titre = "Du supremium éveillé"
deps = ["eveil", "cognizant"]
boss = true
forme = "diamond"
taches = ["item mysticalagriculture:awakened_supremium_essence 9"]
recompenses = ["xp 10"]
description = """
Un bloc éveillé se défait en neuf essences de &csupremium éveillé&r ; un lingot de prospérité et deux essences font un lingot éveillé. Le reste du chapitre éveille chaque pièce, jusqu'à la &lhoue éveillée&r qui ne s'use pas — celle que demande le pylône de récolte.
"""

[[quete]]
cle = "cognizant"
titre = "La poussière cognizante"
deps = ["eveil"]
taches = ["item mysticalagriculture:cognizant_dust"]
recompenses = ["xp 10"]
description = """
Le &5Wither&r et l'&5Ender Dragon&r lâchent de la &dpoussière cognizante&r quand ils sont tués avec une arme d'essence enchantée &bMystical Enlightenment&r. Les deux sont activés sur le serveur. Il en faut quatre pour chaque bloc de supremium éveillé.
"""

[[quete]]
cle = "fin"
titre = "&aLa ferme remplace la mine"
deps = ["netherite", "eveille"]
exigence = "une"
taille = 1.5
icone = "mysticalagriculture:awakened_supremium_essence"
taches = ["checkmark Mes champs tournent"]
recompenses = ["xp 10"]
description = """
Du fer à la nétherite en graines, un autel, des accélérateurs. Chaque graine du pack a sa quête à l'&7Herbier&r de l'Encyclopédie ; ici, ce sont les paliers. Le chapitre &aPylons&r ajoute la récolte automatique sans énergie, à une condition près.
"""

# ---- Paliers complets (BMC-89, 5 octobre 2026) : armure, outils, arrosoir,
# four, accélérateur, terre et amélioration de machine à chaque palier, puis
# chaque pièce éveillée (une quête par objet) ; les 55 augments (palier et
# type lus dans ModAugments et les classes d'augment, javap ; recettes
# augment/*.json ; activés par défaut, aucune config ne les coupe) ; les
# machines. Échelles et preuves : donnees/paliers/mystical-agriculture.toml.
# Les graines, une par culture, sont à l'Herbier de l'Encyclopédie.
[[quete]]
cle = "armure_inferium"
titre = "L'armure d'inferium"
deps = ["inferium"]
optionnel = true
taches = ["item mysticalagriculture:inferium_helmet", "item mysticalagriculture:inferium_chestplate", "item mysticalagriculture:inferium_leggings", "item mysticalagriculture:inferium_boots"]
recompenses = ["xp 3"]
description = """
Chaque pièce d'armure d'essence part de la pièce du palier d'avant (les pièces en diamant pour l'inferium), avec deux lingots et deux gemmes d'inferium. Un lingot : un lingot de prospérité et deux essences ; une gemme : une gemme de prospérité et deux essences. Les quatre pièces, à garder. Chaque pièce porte un augment de palier Inferium au plus.
"""

[[quete]]
cle = "outils_inferium"
titre = "Les outils d'inferium"
deps = ["inferium"]
optionnel = true
taches = ["item mysticalagriculture:inferium_sword", "item mysticalagriculture:inferium_pickaxe", "item mysticalagriculture:inferium_axe", "item mysticalagriculture:inferium_shovel", "item mysticalagriculture:inferium_hoe", "item mysticalagriculture:inferium_sickle", "item mysticalagriculture:inferium_scythe", "item mysticalagriculture:inferium_bow", "item mysticalagriculture:inferium_crossbow", "item mysticalagriculture:inferium_shears", "item mysticalagriculture:inferium_fishing_rod"]
recompenses = ["xp 3"]
description = """
Épée, pioche, hache, pelle, houe, faucille, faux, arc, arbalète, cisailles et canne à pêche : onze outils, chacun fait de l'outil du palier d'avant, de deux lingots et de deux gemmes. Au premier palier, on part des outils en diamant, d'un arc, d'une arbalète, de cisailles, d'une canne à pêche, et de la faux et de la faucille en diamant du mod. La faucille fauche les plantes sur une zone, la faux récolte sans arracher et frappe large ; plus le palier monte, plus la zone grandit. Chaque outil porte un augment de palier Inferium au plus.
"""

[[quete]]
cle = "arrosoir"
titre = "Un arrosoir d'inferium"
deps = ["inferium", "arrosoir_simple"]
optionnel = true
taches = ["item mysticalagriculture:inferium_watering_can"]
recompenses = ["xp 3"]
description = """
L'arrosoir du palier d'avant, quatre lingots d'inferium et quatre engrais mystiques. Il arrose plus loin et fait pousser plus vite ; accroupi, un clic droit dans le vide le met en arrosage automatique.
"""

[[quete]]
cle = "four_inferium"
titre = "Un four d'inferium"
deps = ["inferium"]
optionnel = true
taches = ["item mysticalagriculture:inferium_furnace"]
recompenses = ["xp 3"]
description = """
Le four d'avant (un four ordinaire), deux lingots, une essence et un bloc d'inferium. Chaque palier cuit plus vite et use moins de combustible.
"""

[[quete]]
cle = "amelioration_inferium"
titre = "L'amélioration d'inferium"
deps = ["inferium", "base_amelioration"]
optionnel = true
taches = ["item mysticalagriculture:inferium_upgrade"]
recompenses = ["xp 3"]
description = """
Quatre essences et quatre lingots d'inferium autour de l'amélioration d'avant (la base d'amélioration). Posée dans une machine du mod, elle la fait travailler plus vite, et consommer plus vite.
"""

[[quete]]
cle = "armure_prudentium"
titre = "L'armure de prudentium"
deps = ["prudentium", "armure_inferium"]
optionnel = true
taches = ["item mysticalagriculture:prudentium_helmet", "item mysticalagriculture:prudentium_chestplate", "item mysticalagriculture:prudentium_leggings", "item mysticalagriculture:prudentium_boots"]
recompenses = ["xp 5"]
description = """
Casque, plastron, jambières, bottes : chaque pièce d'inferium, deux lingots et deux gemmes de prudentium. L'enchantement, la durabilité et les augments déjà posés suivent la pièce. Chaque pièce porte un augment de palier Prudentium au plus.
"""

[[quete]]
cle = "outils_prudentium"
titre = "Les outils de prudentium"
deps = ["prudentium", "outils_inferium"]
optionnel = true
taches = ["item mysticalagriculture:prudentium_sword", "item mysticalagriculture:prudentium_pickaxe", "item mysticalagriculture:prudentium_axe", "item mysticalagriculture:prudentium_shovel", "item mysticalagriculture:prudentium_hoe", "item mysticalagriculture:prudentium_sickle", "item mysticalagriculture:prudentium_scythe", "item mysticalagriculture:prudentium_bow", "item mysticalagriculture:prudentium_crossbow", "item mysticalagriculture:prudentium_shears", "item mysticalagriculture:prudentium_fishing_rod"]
recompenses = ["xp 5"]
description = """
Épée, pioche, hache, pelle, houe, faucille, faux, arc, arbalète, cisailles et canne à pêche : onze outils, chacun fait de l'outil du palier d'avant, de deux lingots et de deux gemmes. Plus le palier monte, plus ils sont solides et plus la faux et la faucille portent loin. Chaque outil porte un augment de palier Prudentium au plus.
"""

[[quete]]
cle = "arrosoir_prudentium"
titre = "Un arrosoir de prudentium"
deps = ["prudentium", "arrosoir"]
optionnel = true
taches = ["item mysticalagriculture:prudentium_watering_can"]
recompenses = ["xp 5"]
description = """
L'arrosoir du palier d'avant, quatre lingots de prudentium et quatre engrais mystiques. Il arrose plus loin et fait pousser plus vite ; accroupi, un clic droit dans le vide le met en arrosage automatique.
"""

[[quete]]
cle = "four_prudentium"
titre = "Un four de prudentium"
deps = ["prudentium", "four_inferium"]
optionnel = true
taches = ["item mysticalagriculture:prudentium_furnace"]
recompenses = ["xp 5"]
description = """
Le four d'avant (celui d'inferium), deux lingots, une essence et un bloc de prudentium. Chaque palier cuit plus vite et use moins de combustible.
"""

[[quete]]
cle = "accelerateur_prudentium"
titre = "Un accélérateur de prudentium"
deps = ["prudentium", "accelerateur"]
optionnel = true
taches = ["item mysticalagriculture:prudentium_growth_accelerator"]
recompenses = ["xp 5"]
description = """
Quatre essences de prudentium, quatre pierres et une gemme de prudentium. Posé sous la terre, il fait pousser plus vite la culture au-dessus ; les accélérateurs s'empilent, de tous paliers.
"""

[[quete]]
cle = "terre_prudentium"
titre = "De la terre de prudentium"
deps = ["prudentium", "terre"]
optionnel = true
taches = ["item mysticalagriculture:prudentium_farmland 8"]
recompenses = ["xp 5"]
description = """
Un clic droit avec une essence de prudentium sur de la terre labourée. Une culture du même palier y a dix chances sur cent de plus de rendre une seconde graine.
"""

[[quete]]
cle = "amelioration_prudentium"
titre = "L'amélioration de prudentium"
deps = ["prudentium", "amelioration_inferium"]
optionnel = true
taches = ["item mysticalagriculture:prudentium_upgrade"]
recompenses = ["xp 5"]
description = """
Quatre essences et quatre lingots de prudentium autour de l'amélioration d'avant (celle d'inferium). Posée dans une machine du mod, elle la fait travailler plus vite, et consommer plus vite.
"""

[[quete]]
cle = "armure_tertium"
titre = "L'armure de tertium"
deps = ["tertium", "armure_prudentium"]
optionnel = true
taches = ["item mysticalagriculture:tertium_helmet", "item mysticalagriculture:tertium_chestplate", "item mysticalagriculture:tertium_leggings", "item mysticalagriculture:tertium_boots"]
recompenses = ["xp 7"]
description = """
Casque, plastron, jambières, bottes : chaque pièce de prudentium, deux lingots et deux gemmes de tertium. L'enchantement, la durabilité et les augments déjà posés suivent la pièce. Chaque pièce porte un augment de palier Tertium au plus.
"""

[[quete]]
cle = "outils_tertium"
titre = "Les outils de tertium"
deps = ["tertium", "outils_prudentium"]
optionnel = true
taches = ["item mysticalagriculture:tertium_sword", "item mysticalagriculture:tertium_pickaxe", "item mysticalagriculture:tertium_axe", "item mysticalagriculture:tertium_shovel", "item mysticalagriculture:tertium_hoe", "item mysticalagriculture:tertium_sickle", "item mysticalagriculture:tertium_scythe", "item mysticalagriculture:tertium_bow", "item mysticalagriculture:tertium_crossbow", "item mysticalagriculture:tertium_shears", "item mysticalagriculture:tertium_fishing_rod"]
recompenses = ["xp 7"]
description = """
Épée, pioche, hache, pelle, houe, faucille, faux, arc, arbalète, cisailles et canne à pêche : onze outils, chacun fait de l'outil du palier d'avant, de deux lingots et de deux gemmes. Plus le palier monte, plus ils sont solides et plus la faux et la faucille portent loin. Chaque outil porte un augment de palier Tertium au plus.
"""

[[quete]]
cle = "arrosoir_tertium"
titre = "Un arrosoir de tertium"
deps = ["tertium", "arrosoir_prudentium"]
optionnel = true
taches = ["item mysticalagriculture:tertium_watering_can"]
recompenses = ["xp 7"]
