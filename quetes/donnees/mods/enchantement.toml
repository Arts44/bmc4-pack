# Chapitre « Magie : enchantement » — cahier des charges §5.14
# Sources : lang d'Enchanting Infuser, de XP Tome et d'Aether: Treasure
# Reforging ; easyanvils-server.toml, easymagic-server.toml et
# easydisenchanting-common.toml et enchantinginfuser-server.toml lus sur
# le serveur 486488 (5 octobre 2026) ; classes d'Easy Disenchanting 1.0.1
# (désenchantement à l'enclume) et d'Easy Magic 8.0.1 (la table garde le
# clic vanilla, donc la statistique enchant_item). Soulbound est retiré
# (BMC-82) : aucune quête n'en parle.

[chapitre]
titre = "&dEnchantement"
fichier = "enchantement"
groupe = "mods"
icone = "enchantinginfuser:enchanting_infuser"
ordre = 12

[[quete]]
cle = "intro"
titre = "&dEnchanter autrement"
sous_titre = "Guide dans #enchanting-infuser sur le Discord."
taille = 1.5
icone = "minecraft:enchanting_table"
taches = ["checkmark Lu"]
recompenses = ["item minecraft:lapis_lazuli 16", "item minecraft:book 4"]
description = """
Le pack change l'enchantement en profondeur : la table vanilla montre ses enchantements et se relance, l'enclume ne punit plus les travaux répétés, un &dinfuseur&r laisse choisir ses enchantements, et un &dtome&r stocke l'expérience.

Le lapis et les livres offerts sont pour la table, en attendant l'infuseur.
"""

[[quete]]
cle = "table"
titre = "La table, version Easy Magic"
racine = true
taches = ["item minecraft:enchanting_table"]
recompenses = ["xp 3"]
description = """
Avec &bEasy Magic&r, la table affiche un indice de l'enchantement proposé, et un bouton relance les trois propositions pour &b5 points&r d'expérience et un lapis. Les étagères comptent même avec un bloc entre elles. Jusqu'à 15 de puissance.
"""

[[quete]]
cle = "etageres"
titre = "Quinze étagères"
deps = ["table"]
taches = ["item minecraft:bookshelf 15"]
recompenses = ["xp 3"]
description = """
&b15 étagères&r, c'est la puissance maximale partout dans le pack : la table d'Easy Magic plafonne à 15, et les deux infuseurs demandent 15 étagères pour leurs niveaux maximaux. Posées autour du bloc avec un espace d'un bloc, sur deux hauteurs ; les coins comptent.

Les étagères ciselées comptent aussi, une par trois livres, à condition de faire face à la table.
"""

[[quete]]
cle = "enchanter"
racine = true
titre = "Dix enchantements à la table"
taches = ["stat minecraft:enchant_item 10"]
recompenses = ["item minecraft:lapis_lazuli 16"]
description = """
Dix objets enchantés à la table. Si les trois propositions ne conviennent pas, le bouton de relance les retire contre &b5 points&r d'expérience et un lapis.
"""

[[quete]]
cle = "enclume"
titre = "L'enclume, version Easy Anvils"
racine = true
taches = ["item minecraft:anvil"]
recompenses = ["xp 3"]
description = """
Avec &bEasy Anvils&r, la pénalité de travaux antérieurs est &lfixe&r (4), plus de « trop cher », les livres coûtent moitié moins, renommer est gratuit, et l'enclume ne casse qu'une fois sur vingt. Réparer et renommer ne comptent pas comme travaux.
"""

[[quete]]
cle = "infuseur"
titre = "Un infuseur d'enchantement"
deps = ["table"]
taille = 1.3
taches = ["item enchantinginfuser:enchanting_infuser"]
recompenses = ["xp 8"]
description = """
L'&dinfuseur&r laisse &lchoisir&r les enchantements de l'objet, et leur niveau, contre de l'expérience. Sa puissance vient des étagères posées en carré autour de lui, sur deux hauteurs : plus d'étagères, plus d'enchantements accessibles.

Sur ce serveur, l'infuseur simple n'enchante que des objets &lsans&r enchantement, ne prend pas les livres et ne répare pas.
"""

[[quete]]
cle = "infuseur_avance"
titre = "L'infuseur avancé"
deps = ["infuseur"]
taches = ["item enchantinginfuser:advanced_enchanting_infuser"]
recompenses = ["xp 8"]
description = """
L'&dinfuseur avancé&r choisit, modifie &let retire&r les enchantements, même sur un objet déjà enchanté, et &lrépare&r outils et armures contre des niveaux, &b25 %&r de durabilité par étape. Il enchante aussi les &llivres&r, et accepte les enchantements d'enclume, comme Tranchant sur une hache. La fin de l'enclume pour les outils de valeur.
"""

[[quete]]
cle = "infuseur_max"
titre = "&dL'infuseur au maximum"
deps = ["infuseur_avance", "etageres"]
taille = 1.5
forme = "diamond"
icone = "enchantinginfuser:advanced_enchanting_infuser"
taches = ["observation block enchantinginfuser:advanced_enchanting_infuser", "item minecraft:bookshelf 15"]
recompenses = ["xp 10"]
description = """
Un infuseur avancé posé, et ses &b15 étagères&r. D'après la config du serveur, les enchantements s'ouvrent ainsi : les communs tout de suite, les peu communs à 3 étagères, les rares à 6, les très rares à 9 ; leur niveau maximal arrive 6 étagères plus loin, donc à 15 pour les très rares.

Ce que l'infuseur ne donne jamais ici : les enchantements de &ltrésor&r (Raccommodage), les &lmalédictions&r, et ceux qu'on ne trouve ni à la table ni chez les marchands (Agilité des âmes). Ceux-là viennent des coffres, des marchands et de la pêche.
"""

[[quete]]
cle = "desenchanter"
titre = "Désenchanter"
deps = ["intro"]
taches = ["checkmark Compris"]
recompenses = ["xp 2"]
description = """
&bEasy Disenchanting&r se fait à l'&lenclume&r : l'objet enchanté d'un côté, un livre de l'autre. Le livre repart avec &ltous&r les enchantements de l'objet, et l'objet est rendu, sans eux. Le coût en niveaux dépend des enchantements transférés.
"""

[[quete]]
cle = "tome"
titre = "Un tome d'expérience"
racine = true
taches = ["item xpbook:xp_tome"]
recompenses = ["xp 5"]
description = """
Le &5tome d'XP&r : accroupi, clic droit pour y verser toute l'expérience possible ; clic droit pour la reprendre. On ne meurt plus avec ses niveaux sur soi — ni en raid, ni ailleurs.
"""

[[quete]]
cle = "reforge"
titre = "Les modèles de forge de l'Aether"
racine = true
optionnel = true
taches = ["item aether_treasure_reforging:neptune_upgrade_smithing_template"]
recompenses = ["xp 5"]
description = """
&bAether: Treasure Reforging&r ajoute trois modèles de forge : &bNeptune&r (armure de zanite + maille de Neptune), &6Phénix&r (armure de gravitite + lingot pyral), &fValkyrie&r (équipement de gravitite + lingot de valkyrum). Les trésors des donjons de l'Aether, refondus en équipement.
"""

[[quete]]
cle = "fin"
titre = "&dL'équipement est enchanté"
deps = ["infuseur_max", "enchanter", "tome"]
taille = 1.3
icone = "minecraft:enchanted_book"
taches = ["checkmark Mon équipement est prêt"]
recompenses = ["xp 5"]
description = """
Un infuseur, un tome, une enclume qui ne punit plus. Ce qu'il manque encore se trouve chez les marchands, dans les donjons, et dans les coffres par joueur.
"""
