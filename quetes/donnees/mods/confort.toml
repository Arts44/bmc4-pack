# Chapitre « Confort » — cahier des charges §5.21
# Sources (5 octobre 2026) : progrès du jar inmis (bébé, élimé, plaqué,
# doré, orné de gemmes, ardent, flétri, sans fin, bourse de l'Ender ;
# textes « Surround your Frayed Backpack with Iron Ingots ») ; comforts-
# server.toml du serveur (sac de couchage la nuit, hamac le jour, les deux
# tiennent les phantoms à distance, pas de casse) ; Ping Wheel (lang :
# canal, couleur d'équipe FTB Teams) ; Mouse Tweaks, Jade, JEI/EMI, Xaero
# : côté client, cases à cocher. Inmis (BMC-89, paliers) : recettes du jar
# (le sac flétri part du sac orné de gemmes, pas du sac ardent) et
# /config/inmis.json du serveur (cases, sac ardent insensible au feu, boîtes
# de Shulker interdites dans les sacs). Le sac élimé et le sac plaqué sont déjà
# au chapitre Bienvenue : on reprend après.

[chapitre]
titre = "&eConfort"
fichier = "mods_confort"
groupe = "mods"
icone = "inmis:gilded_backpack"
ordre = 21

[[quete]]
cle = "intro"
titre = "&eLes petits mods qui changent tout"
sous_titre = "Guide dans #astuces sur le Discord."
taille = 1.5
icone = "minecraft:red_bed"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Les sacs d'Inmis jusqu'au bout, dormir n'importe où, les touches qui font gagner du temps. Le sac élimé et le sac plaqué sont au chapitre &eBienvenue&r.
"""

[[quete]]
cle = "dore"
titre = "Le sac doré"
racine = true
taches = ["advancement inmis:gilded_backpack"]
recompenses = ["xp 5"]
description = """
Le sac plaqué entouré de huit lingots d'or : trois rangées de neuf cases (config du serveur). Chaque palier se fabrique autour du sac d'avant, qui garde son contenu. Sur ce serveur, une boîte de Shulker n'entre pas dans un sac.
"""

[[quete]]
cle = "gemmes"
titre = "Le sac orné de gemmes"
deps = ["dore"]
taches = ["advancement inmis:bejeweled_backpack"]
recompenses = ["xp 8"]
description = """
Le sac doré, quatre diamants et quatre émeraudes : cinq rangées de neuf cases. De lui partent deux branches, le sac ardent et le sac flétri.
"""

[[quete]]
cle = "ardent"
titre = "Le sac ardent"
deps = ["gemmes"]
optionnel = true
taches = ["advancement inmis:blazing_backpack"]
recompenses = ["xp 10"]
description = """
Une branche à part : le sac orné de gemmes, quatre lingots de nétherite et quatre blocs de magma. Six rangées de neuf cases, et il ne brûle pas dans la lave.
"""

[[quete]]
cle = "fletri"
titre = "Le sac flétri"
deps = ["gemmes"]
taches = ["advancement inmis:withered_backpack"]
recompenses = ["xp 12"]
description = """
Le sac orné de gemmes, une étoile du Nether et sept sables des âmes : six rangées de onze cases.
"""

[[quete]]
cle = "sans_fin"
titre = "&eLe sac sans fin"
deps = ["fletri"]
forme = "diamond"
taille = 1.3
taches = ["advancement inmis:endless_backpack"]
recompenses = ["xp 20"]
description = """
Le sac flétri, une tête de dragon et sept pierres de l'End : six rangées de quinze cases, le dernier palier d'Inmis. Chaque sac du pack, Inmis et Quark, est aussi à la collection &7Sacs&r de l'Encyclopédie.
"""

[[quete]]
cle = "bourse"
titre = "Une bourse de l'Ender"
racine = true
optionnel = true
taches = ["advancement inmis:ender_pouch"]
recompenses = ["xp 5"]
description = """
La main dedans, et c'est ton coffre de l'Ender qui s'ouvre (texte du progrès).
"""

[[quete]]
cle = "bebe"
titre = "Un sac bébé"
racine = true
optionnel = true
taches = ["advancement inmis:baby_backpack"]
recompenses = ["xp 2"]
description = """
Parfait pour un cadeau (texte du progrès).
"""

# ---- Comforts
[[quete]]
cle = "sac_couchage"
titre = "Un sac de couchage"
racine = true
taches = ["tag comforts:sleeping_bags 1 Un sac de couchage"]
recompenses = ["xp 3"]
description = """
&eComforts&r : un sac de couchage se déroule n'importe où, la &lnuit&r, sans changer ton point de réapparition. Se poser dessus suffit (config du serveur). Il tient les phantoms à distance, et ne s'use pas.
"""

[[quete]]
cle = "hamac"
titre = "Un hamac"
deps = ["sac_couchage"]
optionnel = true
taches = ["item comforts:rope_and_nail"]
recompenses = ["xp 3"]
description = """
Corde et clou, une toile entre deux : le hamac se tend le &ljour&r et le fait passer (config).
"""

# ---- côté client
[[quete]]
cle = "touches"
titre = "Les touches de JEI"
deps = ["intro"]
taches = ["checkmark Je connais R et U"]
recompenses = ["xp 2"]
description = """
Sur un objet, &lR&r montre sa recette, &lU&r ce qu'il sert à fabriquer. L'onglet Métiers dit quel villageois le vend, l'onglet Reproduction (Just Enough Breeding) ce que mange chaque bête.
"""

[[quete]]
cle = "souris"
titre = "Mouse Tweaks et Jade"
deps = ["intro"]
optionnel = true
taches = ["checkmark Compris"]
recompenses = ["xp 2"]
description = """
&eMouse Tweaks&r : clic maintenu pour étaler ou ramasser une pile, molette pour déplacer un à un. &eJade&r : le bloc ou la créature visée s'affiche en haut de l'écran.
"""

[[quete]]
cle = "ping"
titre = "Un ping pour sa faction"
deps = ["intro"]
taches = ["checkmark J'ai pingé"]
recompenses = ["xp 2"]
description = """
&ePing Wheel&r : une touche pose un marqueur visible par les autres joueurs du même &lcanal&r. Règle le canal au nom de ta faction dans les options du mod, et le ping ne sort pas de la faction.
"""

[[quete]]
cle = "xaero"
titre = "Un point de passage"
deps = ["intro"]
taches = ["checkmark Un point posé"]
recompenses = ["xp 2"]
description = """
Carte &bXaero&r (touche &bM&r) : un point de passage se pose d'un clic, se nomme, se colore. La minicarte en haut à gauche les montre.
"""

# Magnum Torch 8.0.2 : recettes du jar ; magnumtorch-server.toml du serveur
# (diamant : MONSTER, 64 × 32, NATURAL/PATROL/STRUCTURE/JOCKEY ; émeraude :
# CREATURE, 128 × 64, NATURAL/EVENT ; améthyste : créatures aquatiques et
# ambiantes, 64 × 32, NATURAL).
[[quete]]
cle = "torche_magnum"
titre = "Une torche Magnum en diamant"
racine = true
optionnel = true
taches = ["item magnumtorch:diamond_magnum_torch"]
recompenses = ["xp 8"]
description = """
Deux lingots d'or, une boule de feu, deux bûches et quatre diamants. Posée, la torche Magnum en diamant empêche les monstres d'apparaître d'eux-mêmes sur 64 blocs autour d'elle, et 32 en hauteur. Elle bloque aussi les patrouilles. Elle n'arrête ni les générateurs de monstres ni les raids : une base de faction reste attaquable.
"""

[[quete]]
cle = "torches_magnum"
titre = "Les deux autres torches Magnum"
deps = ["torche_magnum"]
optionnel = true
taches = ["item magnumtorch:emerald_magnum_torch", "item magnumtorch:amethyst_magnum_torch"]
recompenses = ["xp 5"]
description = """
Même recette, avec des émeraudes ou des éclats d'améthyste. Celle en émeraude empêche les animaux d'apparaître sur 128 blocs. Celle en améthyste empêche les poissons, calamars, axolotls et chauves-souris sur 64 blocs.
"""

[[quete]]
cle = "fin"
titre = "&eConfortable"
deps = ["sans_fin", "sac_couchage"]
taille = 1.3
icone = "inmis:endless_backpack"
taches = ["checkmark Installé"]
recompenses = ["xp 5"]
