# Chapitre « Create — les bases » — cahier des charges §5.1

[chapitre]
titre = "&bCreate — les bases"
fichier = "create_bases"
groupe = "mods"
icone = "create:cogwheel"
ordre = 0

[[quete]]
cle = "intro"
titre = "&bCreate : la force de rotation"
sous_titre = "Guide complet dans #create sur le Discord."
taille = 1.5
icone = "create:cogwheel"
taches = ["checkmark Lu"]
recompenses = ["item create:andesite_alloy 16"]
description = """
&bCreate&r remplace l'électricité par la &lrotation&r : une roue tourne, un arbre transmet, une machine travaille. Tout se voit, tout s'entend, et tout se construit avec de l'andésite et du cuivre.

Deux réflexes à prendre : la touche &bW&r en survolant un bloc Create ouvre &lPonder&r, une animation qui montre comment il s'utilise ; et la &6clé&r (wrench) tourne ou démonte n'importe quel composant.

Les seize alliages d'andésite offerts suffisent aux premiers arbres et engrenages.
"""

[[quete]]
cle = "zinc"
titre = "Du zinc brut"
deps = ["intro"]
taches = ["item create:raw_zinc 4"]
recompenses = ["xp 3"]
description = """
Le &7zinc&r est le minerai propre à Create. Il se trouve dans la pierre comme le fer, souvent en veines près de la surface. Avec le cuivre, il donne le laiton ; seul, il entre dans l'alliage d'andésite.
"""

[[quete]]
cle = "alliage"
titre = "Fabriquer de l'alliage d'andésite"
deps = ["zinc"]
taches = ["item create:andesite_alloy 16"]
recompenses = ["xp 3"]
description = """
L'&7alliage d'andésite&r se fabrique à la table : andésite et pépites de fer ou de zinc. C'est la matière première de presque tout le début de Create : arbres, engrenages, boîtiers, courroies.

Plus tard, un mélangeur le produira en quantité ; pour l'instant, la table suffit.
"""

[[quete]]
cle = "arbre"
titre = "Des arbres de transmission"
deps = ["alliage"]
taches = ["item create:shaft 8"]
recompenses = ["xp 2"]
description = """
L'&7arbre&r transmet la rotation en ligne droite, sans changer ni la vitesse ni le sens. Huit alliages en donnent huit. C'est le bloc le plus posé de tout Create.
"""

[[quete]]
cle = "engrenage"
titre = "Des engrenages"
deps = ["arbre"]
taches = ["item create:cogwheel 4", "item create:large_cogwheel 2"]
recompenses = ["xp 3"]
description = """
Deux &7engrenages&r côte à côte tournent en sens inverse. Un petit contre un grand change la vitesse : &lpetit vers grand&r divise par deux, grand vers petit double. C'est la seule boîte de vitesses des débuts.
"""

[[quete]]
cle = "manivelle"
titre = "Une manivelle"
deps = ["arbre"]
taches = ["item create:hand_crank"]
recompenses = ["xp 2"]
description = """
La &7manivelle&r se tourne à la main (clic droit maintenu) et donne un peu de rotation, le temps de tester une machine ou de dépanner. Elle creuse la faim : ce n'est pas une source d'énergie, c'est un outil.
"""

[[quete]]
cle = "roue"
titre = "Une roue hydraulique"
deps = ["engrenage"]
taches = ["item create:water_wheel"]
recompenses = ["xp 5"]
description = """
La &broue hydraulique&r est la première vraie source : un courant d'eau qui la frôle la fait tourner. Plus d'eau sur ses pales, plus de force. La &lgrande roue&r (large water wheel) fait mieux, pour trois fois le bois.

Un seau d'eau au-dessus d'une roue de 1 bloc suffit à lancer un moulin ou une presse.
"""

[[quete]]
cle = "moulin"
titre = "Un moulin à vent"
deps = ["engrenage"]
taches = ["item create:windmill_bearing", "item create:white_sail 8"]
recompenses = ["xp 5"]
description = """
Le &bpalier de moulin&r assemble les blocs posés dessus en une roue de voiles. Au moins huit &fvoiles&r, et il tourne tout seul, sans eau. Plus de voiles, plus de force : c'est la source gratuite des grandes bases, à condition d'avoir le ciel.

La laine fait aussi des voiles, dans n'importe quelle couleur.
"""

[[quete]]
cle = "boite"
titre = "Boîte de vitesses, embrayage, inverseur"
deps = ["engrenage"]
taches = ["item create:gearbox", "item create:clutch", "item create:gearshift"]
recompenses = ["xp 3"]
description = """
La &7boîte de vitesses&r sort la rotation sur quatre faces. L'&7embrayage&r la coupe sur un signal redstone, l'&7inverseur&r la retourne. Avec ces trois blocs, on pilote une machine depuis un levier.
"""

[[quete]]
cle = "courroie"
titre = "Une courroie"
deps = ["arbre"]
taches = ["item create:belt 4"]
recompenses = ["xp 3"]
description = """
Une &7courroie&r relie deux arbres distants et transporte des objets dessus. Clic droit avec la courroie sur le premier arbre, puis sur le second, jusqu'à vingt blocs.

Sans courroie, il n'y a pas de chaîne de production.
"""

[[quete]]
cle = "cle"
titre = "La clé et les lunettes"
deps = ["alliage"]
taches = ["item create:wrench", "item create:goggles"]
recompenses = ["xp 3"]
description = """
La &6clé&r démonte un composant Create d'un clic et le tourne d'un clic accroupi. Les &6lunettes&r, portées, affichent la vitesse et la contrainte d'un réseau quand on le regarde.

La &ccontrainte&r est la notion à comprendre : chaque machine consomme de la force, chaque source en fournit une quantité limitée. Trop de machines sur une roue, et tout s'arrête.
"""

[[quete]]
cle = "presse"
titre = "Fabriquer une presse mécanique"
deps = ["roue", "moulin"]
exigence = "une"
taille = 1.3
taches = ["item create:mechanical_press"]
recompenses = ["xp 8"]
description = """
La &bpresse mécanique&r écrase ce qui passe dessous : un lingot devient une &7plaque&r, et au-dessus d'un bassin elle compacte (neuf lingots en un bloc, ou de la pâte en briques). C'est la première machine qui transforme vraiment.

Elle se pose au-dessus d'un dépôt ou d'une courroie, alimentée par un engrenage sur le côté.
"""

[[quete]]
cle = "melangeur"
titre = "Fabriquer un mélangeur"
deps = ["presse"]
taches = ["item create:mechanical_mixer"]
recompenses = ["xp 8"]
description = """
Le &bmélangeur&r, posé au-dessus d'un &7bassin&r, combine des objets et des liquides : alliage d'andésite en série, laiton, pâte, et bien d'autres recettes qui n'existent que là. Il demande plus de vitesse qu'une presse.
"""

[[quete]]
cle = "bassin"
titre = "Un bassin et un dépôt"
deps = ["presse"]
taches = ["item create:basin", "item create:depot"]
recompenses = ["xp 3"]
description = """
Le &7bassin&r reçoit objets et liquides pour la presse et le mélangeur, et vide son résultat sur le côté vers une courroie ou un dépôt. Le &7dépôt&r, lui, est un simple plateau : une courroie y dépose, une machine y travaille.
"""

[[quete]]
cle = "meule"
titre = "Fabriquer une meule"
deps = ["engrenage"]
taches = ["item create:millstone"]
recompenses = ["xp 5"]
description = """
La &bmeule&r moud lentement : blé en farine, os en poudre, gravier en silex. On y verse à la main ou par entonnoir, et un entonnoir en dessous récupère.

C'est la machine la plus simple de Create, et une manivelle suffit à la lancer.
"""

[[quete]]
cle = "concasseur"
titre = "Des roues de broyage"
deps = ["presse"]
taille = 1.3
taches = ["item create:crushing_wheel 2"]
recompenses = ["xp 8"]
description = """
Deux &broues de broyage&r face à face, tournant l'une vers l'autre, broient ce qu'on jette entre elles. Un minerai brut donne du &7minerai concassé&r, et le concassé lavé donne &lplus de lingots&r que la cuisson directe.

C'est ici que Create rentabilise la mine. Les deux roues doivent tourner en sens opposé : vérifie avec les lunettes.
"""

[[quete]]
cle = "ventilateur"
titre = "Un ventilateur encastré"
deps = ["engrenage"]
taches = ["item create:encased_fan"]
recompenses = ["xp 3"]
description = """
Le &7ventilateur encastré&r souffle de l'air à travers le bloc qu'il a devant lui. Ce que l'air traverse décide de l'effet : de l'eau lave, du feu cuit, de la lave fond, de la flamme d'âme hante. Trois quêtes suivent, une par effet.
"""

[[quete]]
cle = "lavage"
titre = "Laver au ventilateur"
deps = ["ventilateur"]
taches = ["item minecraft:clay_ball 4"]
recompenses = ["xp 3"]
description = """
Un ventilateur qui souffle à travers de l'&beau&r lave ce qui est posé devant. Du sable devient de l'argile, du gravier du silex, et le &7minerai concassé&r devient des pépites, avec un bonus. Quatre boules d'argile prouvent le montage.
"""

[[quete]]
cle = "fumage"
titre = "Fumer au ventilateur"
deps = ["ventilateur"]
taches = ["item minecraft:cooked_beef 4"]
recompenses = ["xp 3"]
description = """
À travers du &6feu&r ou un feu de camp, l'air cuit la nourriture, en continu et sans combustible. Une courroie qui passe devant, et la viande ressort cuite.
"""

[[quete]]
cle = "hantise"
titre = "Hanter au ventilateur"
deps = ["ventilateur"]
taches = ["item minecraft:soul_soil 4"]
recompenses = ["xp 3"]
description = """
À travers un &3feu d'âme&r, l'air hante : le sable des âmes devient de la terre des âmes, et quelques objets changent de nature. Le feu d'âme se fait avec du sable des âmes sous la flamme, ramené du Nether.
"""

[[quete]]
cle = "entonnoir"
titre = "Entonnoir et tunnel en andésite"
deps = ["courroie"]
taches = ["item create:andesite_funnel 2", "item create:andesite_tunnel"]
recompenses = ["xp 3"]
description = """
L'&7entonnoir&r fait entrer ou sortir des objets d'une courroie, d'un dépôt ou d'un coffre. Le &7tunnel&r couvre une courroie et permet de brancher des entonnoirs sur les côtés. Avec eux, une chaîne ne demande plus de main.
"""

[[quete]]
cle = "goulotte"
titre = "Une goulotte"
deps = ["entonnoir"]
taches = ["item create:chute"]
recompenses = ["xp 2"]
description = """
La &7goulotte&r fait descendre les objets d'un bloc à l'autre à la verticale, sans courroie. Sous une meule ou un concasseur, elle amène tout dans un coffre.
"""

[[quete]]
cle = "boitier"
titre = "Des boîtiers d'andésite"
deps = ["alliage"]
taches = ["item create:andesite_casing 8"]
recompenses = ["xp 3"]
description = """
Le &7boîtier d'andésite&r se fait en frappant une bûche écorcée avec de l'alliage. Il encase les arbres et les engrenages, et entre dans la plupart des machines de ce chapitre.
"""

[[quete]]
cle = "fin"
titre = "&bPremière chaîne de production"
deps = ["concasseur", "lavage", "entonnoir"]
taille = 1.5
icone = "create:mechanical_press"
taches = ["checkmark Ma chaîne tourne"]
recompenses = ["xp 10"]
description = """
Un concasseur, un lavage, des entonnoirs et une courroie : la mine rend davantage sans que personne ne touche à rien. C'est le cœur de Create, et le reste n'est que des machines en plus.

La suite, &bCreate — fabrication avancée&r : le laiton, le mécanisme de précision, le bras mécanique, le moteur à vapeur.
"""
