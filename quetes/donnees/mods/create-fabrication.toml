# Chapitre « Create — fabrication avancée » — cahier des charges §5.2
# Chaque recette citée a été lue dans create-1.20.1-6.0.8.jar (data/create/recipes).

[chapitre]
titre = "&bCreate — fabrication avancée"
fichier = "create_fabrication"
groupe = "mods"
icone = "create:precision_mechanism"
ordre = 1

[[quete]]
cle = "intro"
titre = "&bCreate : le laiton et la précision"
sous_titre = "Après les bases : #create sur le Discord."
taille = 1.5
icone = "create:brass_ingot"
taches = ["checkmark Lu"]
recompenses = ["item create:zinc_ingot 8", "item minecraft:copper_ingot 8"]
description = """
Les bases tournaient à l'andésite. La suite tourne au &6laiton&r : un alliage de cuivre et de zinc qui ne se fait qu'au mélangeur chauffé, et qui ouvre les machines qui pensent un peu — le bras mécanique, le déployeur, les établis mécaniques.

Le zinc et le cuivre offerts font les premiers lingots de laiton. Le brûleur à Blaze, lui, demandera un voyage au Nether.
"""

[[quete]]
cle = "bruleur_vide"
titre = "Un brûleur à Blaze vide"
racine = true
taches = ["item create:empty_blaze_burner"]
recompenses = ["xp 3"]
description = """
Quatre plaques de fer autour d'un bloc de netherrack. Vide, il ne chauffe rien : il faut lui donner un &cBlaze&r. Clic droit sur un Blaze vivant avec le brûleur vide, dans une forteresse du Nether, et le Blaze y reste.
"""

[[quete]]
cle = "bruleur"
titre = "Capturer un Blaze"
deps = ["bruleur_vide"]
taille = 1.3
taches = ["item create:blaze_burner"]
recompenses = ["xp 8"]
description = """
Un &cbrûleur à Blaze&r habité chauffe le bassin posé dessus : c'est lui qui rend possible le laiton, et plus tard le moteur à vapeur. Il se nourrit de combustible ordinaire ; nourri d'un gâteau de Blaze, il surchauffe, et certaines recettes l'exigent.
"""

[[quete]]
cle = "laiton"
titre = "Fondre du laiton"
deps = ["bruleur"]
taille = 1.3
taches = ["item create:brass_ingot 8"]
recompenses = ["xp 8"]
description = """
Dans un bassin chauffé par un brûleur, le mélangeur combine un lingot de cuivre et un lingot de zinc en &6deux lingots de laiton&r. Pas de laiton sans chaleur : le mélangeur seul ne suffit pas.

Le laiton fait les plaques, les boîtiers et les mains de laiton de tout ce chapitre.
"""

[[quete]]
cle = "boitier_laiton"
titre = "Des boîtiers de laiton"
deps = ["laiton"]
taches = ["item create:brass_casing 4"]
recompenses = ["xp 3"]
description = """
Comme le boîtier d'andésite, mais au laiton : frapper une bûche écorcée avec un lingot de laiton. Le régulateur de vitesse, le bras et les établis mécaniques en demandent.
"""

[[quete]]
cle = "quartz_rose"
titre = "Du quartz rose poli"
racine = true
taches = ["item create:polished_rose_quartz 4"]
recompenses = ["xp 3"]
description = """
Le &dquartz rose&r se fabrique avec un quartz et huit poudres de redstone, puis se polit au &7papier de verre&r (clic droit maintenu, ou un déployeur qui tient le papier). C'est le cœur du tube électronique.
"""

[[quete]]
cle = "tube"
titre = "Des tubes électroniques"
deps = ["quartz_rose"]
taches = ["item create:electron_tube 4"]
recompenses = ["xp 3"]
description = """
Un quartz rose poli sur une plaque de fer : un &btube électronique&r. Le déployeur, les établis mécaniques et la liaison redstone en ont besoin.
"""

[[quete]]
cle = "deployeur"
titre = "Fabriquer un déployeur"
deps = ["tube", "laiton"]
taille = 1.3
taches = ["item create:deployer"]
recompenses = ["xp 8"]
description = """
Tube électronique, boîtier d'andésite et main de laiton. Le &bdéployeur&r fait un clic droit à ta place, en boucle, avec l'objet qu'on lui donne : il plante, récolte, polit le quartz, et c'est lui qui assemble le mécanisme de précision.
"""

[[quete]]
cle = "precision"
titre = "Un mécanisme de précision"
deps = ["deployeur"]
boss = true
forme = "diamond"
taches = ["item create:precision_mechanism"]
recompenses = ["xp 10"]
description = """
Le premier &lassemblage séquencé&r. Une plaque d'or part sur une courroie, et &l5 fois&r de suite elle passe sous un déployeur qui pose un engrenage, puis un grand engrenage, puis une pépite de fer. Au bout, un &bmécanisme de précision&r — ou, parfois, un rebut : plaque d'or, alliage, engrenage, pépite. La recette l'assume.

Ce mécanisme ouvre le régulateur de vitesse, le bras mécanique et les trains.
"""

[[quete]]
cle = "regulateur"
titre = "Un régulateur de vitesse"
deps = ["precision", "boitier_laiton"]
taches = ["item create:rotation_speed_controller"]
recompenses = ["xp 5"]
description = """
Mécanisme de précision sur boîtier de laiton. Posé sous un grand engrenage, le &brégulateur&r fixe la vitesse de sortie au chiffre qu'on lui donne, quelle que soit l'entrée. Fini les montages d'engrenages pour trouver la bonne vitesse.
"""

[[quete]]
cle = "mesures"
titre = "Mesurer vitesse et contrainte"
deps = ["laiton"]
taches = ["item create:speedometer", "item create:stressometer"]
recompenses = ["xp 3"]
description = """
Le &7compteur de vitesse&r affiche la rotation d'un réseau, le &7stressomètre&r la part de contrainte utilisée. Avec les lunettes, on lit les deux en les regardant. Un réseau à plus de 100 % s'arrête net : le stressomètre le dit avant.
"""

[[quete]]
cle = "bras"
titre = "Fabriquer un bras mécanique"
deps = ["precision", "boitier_laiton"]
taille = 1.3
taches = ["item create:mechanical_arm"]
recompenses = ["xp 8"]
description = """
Plaques de laiton, alliage, mécanisme de précision, boîtier de laiton. Le &bbras mécanique&r prend des objets à des points d'entrée et les dépose à des points de sortie qu'on lui désigne avec le bras en main avant de le poser : dépôts, courroies, bassins, brûleurs. C'est le premier bloc qui remplace un entonnoir et une courroie à la fois.
"""

[[quete]]
cle = "etablis"
titre = "Des établis mécaniques"
deps = ["tube", "boitier_laiton"]
taches = ["item create:mechanical_crafter 9"]
recompenses = ["xp 5"]
description = """
Tube électronique, boîtier de laiton, table d'artisanat : trois &bétablis mécaniques&r par recette. Posés en grille et reliés par des engrenages, ils fabriquent une recette à la fois, chaque case étant alimentée par un entonnoir ou un bras. Neuf établis font une grille complète.
"""

[[quete]]
cle = "scie"
titre = "Une scie mécanique"
racine = true
taches = ["item create:mechanical_saw"]
recompenses = ["xp 5"]
description = """
Plaques de fer, lingot de fer, boîtier d'andésite. Posée à l'horizontale, la &bscie&r coupe les bûches qui passent devant elle en planches, et débite les arbres entiers quand on la monte sur une contraption. À la verticale, elle abat ce qui pousse devant elle.
"""

[[quete]]
cle = "foreuse"
titre = "Une foreuse mécanique"
racine = true
taches = ["item create:mechanical_drill"]
recompenses = ["xp 5"]
description = """
Alliage, lingot de fer, boîtier d'andésite. La &bforeuse&r casse le bloc devant elle, en continu. Sur un piston ou un portique, elle creuse un tunnel ; sur un roulement, elle creuse un puits.
"""

[[quete]]
cle = "piston"
titre = "Un piston mécanique"
racine = true
taches = ["item create:mechanical_piston", "item create:piston_extension_pole 4"]
recompenses = ["xp 5"]
description = """
Dalle de bois, boîtier d'andésite, tige d'extension. Le &bpiston mécanique&r pousse une &lcontraption&r — un ensemble de blocs collés — aussi loin qu'il a de tiges derrière lui. Avec une foreuse devant, c'est une machine à tunnel.
"""

[[quete]]
cle = "roulement"
titre = "Un roulement mécanique"
racine = true
taches = ["item create:mechanical_bearing"]
recompenses = ["xp 5"]
description = """
Dalle de bois, boîtier d'andésite, arbre. Le &broulement&r fait tourner la contraption posée dessus : une porte qui pivote, une moissonneuse circulaire, un moulin décoratif.
"""

[[quete]]
cle = "portique"
titre = "Un portique"
deps = ["piston"]
taches = ["item create:gantry_shaft 8", "item create:gantry_carriage"]
recompenses = ["xp 5"]
description = """
Les &7arbres de portique&r (alliage, redstone, alliage : huit d'un coup) forment un rail ; le &7chariot de portique&r roule dessus et emporte sa contraption. Plus long qu'un piston, et sans tiges à empiler.
"""

[[quete]]
cle = "colle"
titre = "De la super colle"
deps = ["piston"]
taches = ["item create:super_glue"]
recompenses = ["xp 3"]
description = """
La &esuper colle&r définit ce qu'une contraption emporte : clic sur deux coins, tout le volume entre les deux est collé. Sans elle, un piston ne pousse que les blocs directement attachés.
"""

[[quete]]
cle = "pompe"
titre = "Pompe, tuyaux et cuve"
racine = true
taches = ["item create:mechanical_pump", "item create:fluid_pipe 8", "item create:fluid_tank"]
recompenses = ["xp 5"]
description = """
La &bpompe&r (un engrenage et un tuyau) pousse les liquides dans les &7tuyaux&r ; la &7cuve&r (deux plaques de cuivre autour d'un tonneau) les stocke, et plusieurs cuves côte à côte n'en font qu'une. C'est la plomberie dont la vapeur aura besoin.
"""

[[quete]]
cle = "vapeur"
titre = "Un moteur à vapeur"
deps = ["bruleur", "pompe"]
boss = true
forme = "diamond"
taches = ["item create:steam_engine"]
recompenses = ["xp 10"]
description = """
Plaque d'or, alliage, bloc de cuivre. Le &bmoteur à vapeur&r se monte sur une cuve remplie d'eau et chauffée par des brûleurs à Blaze : la cuve devient une chaudière, et chaque moteur sort une rotation forte. C'est la source d'énergie des grandes usines, bien au-delà de la roue et du moulin.
"""

[[quete]]
cle = "gateau"
titre = "Un gâteau de Blaze"
deps = ["bruleur"]
taches = ["item create:blaze_cake"]
recompenses = ["xp 3"]
description = """
Œuf, sucre et farine de cendre compactés dans un bassin donnent la base du gâteau ; remplie de lave, elle devient un &6gâteau de Blaze&r. Donné à un brûleur, il le fait &lsurchauffer&r le temps d'une recette qui l'exige.
"""

[[quete]]
cle = "schema"
titre = "Table à schémas et Schematicannon"
deps = ["laiton"]
taches = ["item create:schematic_table", "item create:schematicannon"]
recompenses = ["xp 5"]
description = """
La &7table à schémas&r charge un plan de construction ; le &7Schematicannon&r le bâtit bloc par bloc, à partir de ce qu'on met dans l'inventaire à côté de lui. On copie une base, on la reconstruit ailleurs.
"""

[[quete]]
cle = "fin"
titre = "&bL'usine tourne"
deps = ["bras", "vapeur"]
taille = 1.5
icone = "create:mechanical_arm"
taches = ["advancement create:steam_engine"]
recompenses = ["xp 10"]
description = """
Du laiton, un bras, des établis, et de la vapeur pour tout faire tourner. La suite, &bCreate — logistique et trains&r, fait circuler ce que l'usine produit.
"""

# ---- §9.4 : machines mobiles et contraptions (5 octobre 2026),
