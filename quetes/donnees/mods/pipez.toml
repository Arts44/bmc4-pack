# Chapitre « Tuyaux et transport : Pipez » — cahier des charges §5.9
# Identifiants vérifiés dans pipez-forge-1.20.1-1.2.26.

[chapitre]
titre = "&7Pipez"
fichier = "pipez"
groupe = "mods"
icone = "pipez:item_pipe"
ordre = 7

[[quete]]
cle = "intro"
titre = "&7Pipez : des tuyaux simples"
sous_titre = "Objets, fluides, énergie, en un bloc."
taille = 1.5
icone = "pipez:universal_pipe"
taches = ["checkmark Lu"]
recompenses = ["item minecraft:iron_ingot 6", "item minecraft:glass 8"]
description = """
&7Pipez&r fait une chose et la fait bien : déplacer. Un tuyau d'objets sort d'un coffre et entre dans un autre ; un tuyau de fluide vide une cuve ; un tuyau d'énergie relie une cellule à une machine. Clic droit avec la clé sur l'extrémité d'un tuyau pour dire s'il aspire ou s'il pousse.

Le fer et le verre offerts font les premiers tuyaux.
"""

[[quete]]
cle = "objets"
titre = "Des tuyaux d'objets"
deps = ["intro"]
taches = ["item pipez:item_pipe 16"]
recompenses = ["xp 3"]
description = """
Le &7tuyau d'objets&r relie des inventaires. Son extrémité se règle en extraction : il tire d'un coffre et pousse dans tout ce qui est relié. Sans amélioration il est lent, et sans filtre.
"""

[[quete]]
cle = "fluides"
titre = "Des tuyaux de fluides"
deps = ["intro"]
taches = ["item pipez:fluid_pipe 8"]
recompenses = ["xp 3"]
description = """
Même logique pour les liquides : une cuve, une source de lave, un bassin Create. C'est lui qui nourrit le Magmator de Powah.
"""

[[quete]]
cle = "energie"
titre = "Des tuyaux d'énergie"
deps = ["intro"]
taches = ["item pipez:energy_pipe 8"]
recompenses = ["xp 3"]
description = """
Le &7tuyau d'énergie&r remplace les câbles de Powah entre une cellule et une machine. Moins cher, moins rapide ; les améliorations règlent ça.
"""

[[quete]]
cle = "universel"
titre = "Un tuyau universel"
deps = ["objets", "fluides", "energie"]
taches = ["item pipez:universal_pipe 4"]
recompenses = ["xp 5"]
description = """
Le &7tuyau universel&r transporte les trois à la fois, chaque face réglée indépendamment. Pratique quand une machine reçoit des objets, un fluide et de l'énergie par le même mur.
"""

[[quete]]
cle = "ameliorations"
titre = "Des améliorations"
deps = ["objets"]
taches = ["item pipez:basic_upgrade", "item pipez:improved_upgrade"]
recompenses = ["xp 5"]
description = """
Une &7amélioration&r se glisse dans l'extrémité d'un tuyau : un débit plus grand, un &lfiltre&r (liste blanche ou noire, par objet ou par tag), un mode redstone, une règle de distribution. Basique, améliorée, avancée, ultime, infinie.
"""

[[quete]]
cle = "cle"
titre = "La clé de Pipez"
deps = ["intro"]
taches = ["item pipez:wrench"]
recompenses = ["xp 2"]
description = """
La &7clé&r ouvre le menu d'une extrémité : mode (extraire ou pousser), filtres, redstone. Accroupi, elle détache un tuyau.
"""

[[quete]]
cle = "fin"
titre = "&7Tout circule"
deps = ["universel", "ameliorations"]
taille = 1.3
icone = "pipez:ultimate_upgrade"
taches = ["checkmark Ma base est reliée"]
recompenses = ["xp 5"]
description = """
Fermes, machines et stockage reliés par des tuyaux. Les filtres de &bFTB Filter System&r et d'&bItem Filters&r se glissent dans les améliorations pour trier plus finement.
"""
