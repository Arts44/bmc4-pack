# Chapitre « Iron's Spells 'n Spellbooks » — cahier des charges §5.6
# Sources, toutes lues le 5 octobre 2026 : recettes et balises du jar
# irons_spellbooks-1.20.1-3.16.3 (data/irons_spellbooks/recipes, tags/items/
# *_focus), son guide Patchouli (assets/.../patchouli_books/iss_guide_book),
# ses textes (en_us.json / fr_fr.json), le scan des pièces NBT (le corps du
# Roi Mort est posé dans catacombs/catacombs_origin.nbt), les classes du jar
# (DeadKingCorpseEntity : clic droit ; CinderousSoulcallerItem invoque
# l'Écho de Tyros) et irons_spellbooks-server.toml du serveur
# (/world/serverconfig : maxUpgrades = 3, scrollRecycleChance = 0.5,
# allowCauldronBrewing = true, additionalWanderingTraderTrades = true,
# spellGriefing = false, swordsConsumeMana = true). Hazen 'n Stuff
# (hazennstuff-watered-down-edition-1.1.2) : noms et recettes du jar
# seulement ; ses bonus chiffrés ne sont pas lisibles, donc pas cités.

[chapitre]
titre = "&5Iron's Spells"
fichier = "irons_spells"
groupe = "mods"
icone = "irons_spellbooks:gold_spell_book"
ordre = 6

[[quete]]
cle = "intro"
titre = "&5Devenir mage"
sous_titre = "Guide dans #irons-spells sur le Discord."
taille = 1.5
icone = "irons_spellbooks:inscription_table"
taches = ["checkmark Lu"]
recompenses = ["item minecraft:paper 16", "item minecraft:book 2"]
description = """
&5Iron's Spells 'n Spellbooks&r ajoute la magie : des &dparchemins&r trouvés dans le monde, des &dgrimoires&r où les inscrire, dix &décoles&r (feu, glace, foudre, sacré, End, sang, évocation, nature, vide, indicible), des mages dans leurs tours, deux boss. Le mana se régénère seul ; chaque sort a un coût et un temps de recharge.

Sur ce serveur, les sorts &lne détruisent pas le terrain&r (spellGriefing désactivé) : une boule de feu dans un claim adverse ne casse rien. Le papier offert fait les premiers grimoires.
"""

[[quete]]
cle = "parchemin"
titre = "Un premier parchemin"
deps = ["intro"]
taches = ["item irons_spellbooks:scroll"]
recompenses = ["xp 3"]
description = """
Les &dparchemins&r se trouvent dans les coffres, sur les mages tués, chez le marchand ambulant. Chacun porte un sort et un niveau. On peut le &lconsommer&r pour lancer le sort une fois, sans mana ni recharge — mais mieux vaut le garder pour l'inscrire dans un grimoire, où il servira sans fin.
"""

[[quete]]
cle = "journal"
titre = "Un Journal fragile"
deps = ["parchemin"]
taches = ["item irons_spellbooks:copper_spell_book"]
recompenses = ["xp 3"]
description = """
Le premier grimoire : du &6cuivre&r, du papier, de la ficelle. Peu d'emplacements, mais c'est lui qui transforme un parchemin à usage unique en sort permanent. Chaque palier de grimoire ajoute des emplacements et souvent un bonus.
"""

[[quete]]
cle = "table"
titre = "Une Table d'inscription"
deps = ["journal"]
taille = 1.3
taches = ["item irons_spellbooks:inscription_table"]
recompenses = ["xp 5"]
description = """
Un livre, trois dalles de bois, deux barrières : la &5Table d'inscription&r. On y pose un grimoire et un parchemin, et le sort passe dans le livre. Le parchemin se récupère en retirant le sort. C'est le geste de base de toute la magie du mod.
"""

[[quete]]
cle = "errant"
titre = "La robe du Magicien errant"
deps = ["table"]
taches = ["item irons_spellbooks:wandering_magician_chestplate"]
recompenses = ["xp 5"]
description = """
De l'&dessence arcanique&r autour d'une armure de cuir : la tenue du &5Magicien errant&r. Le guide du mod la recommande comme première source de mana maximum. L'essence ne se fabrique pas : elle se pille dans les structures magiques et sur les mages.
"""

[[quete]]
cle = "tome"
titre = "Un Tome ferré"
deps = ["journal"]
taches = ["item irons_spellbooks:iron_spell_book"]
recompenses = ["xp 3"]
description = """
Chaînes, cuir, papier : le &7Tome ferré&r, deuxième palier de grimoire, encore sans matière magique. Plus d'emplacements que le journal.
"""

[[quete]]
cle = "forge"
titre = "Une Forge à parchemins"
deps = ["table"]
taille = 1.3
taches = ["item irons_spellbooks:scroll_forge"]
recompenses = ["xp 8"]
description = """
Ardoise polie et obsidienne pleurante : la &5Forge à parchemins&r. Elle fabrique un parchemin avec du papier, une &dencre&r et un &dfoyer&r : l'encre fixe la rareté (donc le niveau), le foyer fixe l'école. C'est le moment où l'on cesse de dépendre du hasard des coffres.
"""

[[quete]]
cle = "encre"
titre = "De l'encre"
deps = ["forge"]
taches = ["item irons_spellbooks:common_ink", "item irons_spellbooks:uncommon_ink"]
recompenses = ["xp 5"]
description = """
Cinq encres, de la &fcommune&r à la &6légendaire&r, qui ne se fabriquent pas : coffres des structures magiques, mages tués, marchand ambulant (activé sur ce serveur). Une encre ne fait que les sorts dont le premier niveau est de sa rareté ou moins. Les niveaux se répartissent ainsi : 30 % communs, 25 % peu communs, 20 % rares, 15 % épiques, 10 % légendaires.
"""

[[quete]]
cle = "apprenti"
titre = "Le Grimoire de l'apprenti"
deps = ["tome"]
taches = ["item irons_spellbooks:gold_spell_book"]
recompenses = ["xp 5"]
description = """
Or, essence arcanique et &cpeau de hoglin&r : le premier grimoire qui demande le Nether. Les hoglins lâchent la peau.
"""

[[quete]]
cle = "tissu"
titre = "Du Tissu arcanique"
deps = ["errant"]
taches = ["item irons_spellbooks:magic_cloth 4"]
recompenses = ["xp 5"]
description = """
Huit essences autour d'un bloc de laine : un &dTissu arcanique&r. Il entre dans les grimoires avancés, les robes de sorcier et l'amélioration d'emplacements. Pour en avoir beaucoup, il faut piller les structures magiques.
"""

[[quete]]
cle = "sorcier"
titre = "Les Robes du sorcier"
deps = ["tissu"]
taches = ["item irons_spellbooks:wizard_chestplate"]
recompenses = ["xp 5"]
description = """
Du tissu arcanique seul, en armure : la tenue du &5Sorcier&r. C'est la base de toutes les armures d'école : chaque robe d'école se fait à partir d'une pièce de sorcier.
"""

# ---- les écoles : une rune chacune. Rune = 8 foyers autour d'une pierre runique vierge (recettes *_rune.json) ;
# la pierre vierge ne se fabrique pas (guide : « runestones » dans les structures magiques, un mage d'école lâche toujours sa rune).
[[quete]]
cle = "ecoles"
titre = "&dLes écoles et leurs foyers"
deps = ["forge"]
taille = 1.3
icone = "irons_spellbooks:blank_rune"
taches = ["item irons_spellbooks:blank_rune"]
recompenses = ["xp 5"]
description = """
Chaque école a un &dfoyer&r, l'objet qui la représente à la forge et dans les recettes : bâton de blaze pour le &cfeu&r, os gelé pour la &bglace&r, bouteille d'éclair pour la &efoudre&r, perle divine pour le &fsacré&r, perle de l'End pour l'&5End&r, fiole de sang pour le &4sang&r, émeraude pour l'&aévocation&r, pomme de terre empoisonnée pour la &2nature&r, éclat d'écho pour l'&8indicible&r.

Une &dpierre runique vierge&r entourée de huit foyers fait la &lrune&r de l'école. La pierre vierge ne se fabrique pas : elle se trouve dans les structures magiques, et chaque mage d'école lâche sa rune.
"""

[[quete]]
cle = "rune_feu"
titre = "Rune de Feu"
deps = ["ecoles"]
taches = ["item irons_spellbooks:fire_rune"]
recompenses = ["xp 3"]
description = """
Huit &cbâtons de blaze&r autour d'une pierre vierge. L'école du feu : dégâts directs et brûlures.
"""

[[quete]]
cle = "rune_glace"
titre = "Rune de Glace"
deps = ["ecoles"]
optionnel = true
taches = ["item irons_spellbooks:ice_rune"]
recompenses = ["xp 3"]
description = """
Huit &bos gelés&r, lâchés par les vagabonds (strays). L'école de la glace : dégâts et contrôle.
"""

[[quete]]
cle = "rune_foudre"
titre = "Rune de Foudre"
deps = ["ecoles"]
optionnel = true
taches = ["item irons_spellbooks:lightning_rune"]
recompenses = ["xp 3"]
description = """
Huit &ebouteilles d'éclair&r : une bouteille vide sur un creeper chargé. L'école de la foudre : des dégâts concentrés.
"""

[[quete]]
cle = "rune_sacre"
titre = "Rune Sacrée"
deps = ["ecoles"]
optionnel = true
taches = ["item irons_spellbooks:holy_rune"]
recompenses = ["xp 3"]
description = """
Huit &fperles divines&r (un lingot d'or et une améthyste chacune). L'école sacrée : soins, soutien, renforts pour les alliés — l'école d'une faction.
"""

[[quete]]
cle = "rune_end"
titre = "Rune de l'End"
deps = ["ecoles"]
optionnel = true
taches = ["item irons_spellbooks:ender_rune"]
recompenses = ["xp 3"]
description = """
Huit &5perles de l'End&r. L'école de l'End : de l'arcane et du mystique, entre dégâts, utilité et déplacement.
"""

[[quete]]
cle = "rune_sang"
titre = "Rune de Sang"
deps = ["ecoles"]
optionnel = true
taches = ["item irons_spellbooks:blood_rune"]
recompenses = ["xp 3"]
description = """
Huit &4fioles de sang&r : des créatures dans un chaudron chauffé par un feu de camp, ou dans le chaudron d'alchimiste. L'école du sang : nécromancie, flétrissement, dégâts qui renforcent le lanceur.
"""

[[quete]]
cle = "rune_evocation"
titre = "Rune d'Évocation"
deps = ["ecoles"]
optionnel = true
taches = ["item irons_spellbooks:evocation_rune"]
recompenses = ["xp 3"]
description = """
Huit &aémeraudes&r. L'école de l'évocation : illusions et conjurations, la plus large palette d'attaque, de défense et d'utilité.
"""

[[quete]]
cle = "rune_nature"
titre = "Rune de Nature"
deps = ["ecoles"]
optionnel = true
taches = ["item irons_spellbooks:nature_rune"]
recompenses = ["xp 3"]
description = """
Huit &2pommes de terre empoisonnées&r. L'école de la nature : affaiblir l'ennemi, puis l'achever.
"""

[[quete]]
cle = "indicible"
titre = "Un Manuscrit indicible"
deps = ["ecoles"]
optionnel = true
taches = ["item irons_spellbooks:eldritch_manuscript"]
recompenses = ["xp 8"]
description = """
L'école &8indicible&r ne se lance ni ne se forge sans l'avoir apprise. Huit &dfragments de savoir ancien&r, trouvés dans le monde, autour d'un éclat d'écho reconstituent un &8Manuscrit indicible&r ; le consommer apprend &lun&r sort indicible. Ensuite, l'éclat d'écho sert de foyer.
"""

[[quete]]
cle = "robe_ecole"
titre = "Une robe d'école"
deps = ["sorcier", "rune_feu"]
taches = ["item irons_spellbooks:pyromancer_chestplate"]
recompenses = ["xp 8"]
description = """
Une pièce de sorcier, la rune de l'école et une essence arcanique : la robe de l'école, ici celle du &cPyromancien&r. Même modèle pour le Cryomancien, l'Électromancien, le Prêtre, le Marchombre, le Cultiste, le Manteau pesteux et l'Archévocateur, chacun avec sa rune. L'armure d'école renforce les sorts de son école.
"""

[[quete]]
cle = "enchante"
titre = "Le Grimoire enchanté"
deps = ["apprenti", "tissu"]
taches = ["item irons_spellbooks:diamond_spell_book"]
recompenses = ["xp 8"]
description = """
Diamants, peau de hoglin, tissu arcanique et un livre enchanté : le &bGrimoire enchanté&r, l'avant-dernier des grimoires fabricables.
"""

[[quete]]
cle = "enclume"
titre = "Une Enclume arcanique"
deps = ["enchante"]
taille = 1.3
taches = ["item irons_spellbooks:arcane_anvil"]
recompenses = ["xp 10"]
description = """
Trois blocs d'améthyste, un diamant, une enclume entre deux ardoises polies : l'&5Enclume arcanique&r, l'atelier de la fin de partie. Elle monte un parchemin d'un niveau avec l'encre de la rareté suivante, améliore armures et grimoires avec des orbes (&ltrois améliorations&r au plus par pièce sur ce serveur), et &limprègne&r une arme d'un sort — l'arme consomme alors du mana, avec une recharge réduite de moitié.
"""

[[quete]]
cle = "mithril"
titre = "Du Mithril"
deps = ["enclume"]
taches = ["item irons_spellbooks:mithril_ingot"]
recompenses = ["xp 5"]
description = """
Le &bmithril&r est un minerai rare de l'Overworld ; le guide du mod le place sous Y −38, dans la roche non exposée à l'air. Le minerai brut se cuit en ferraille au haut-fourneau, quatre ferrailles font un lingot. Il entre dans les orbes, les cadres de portail, les anneaux.
"""

[[quete]]
cle = "braise"
titre = "De l'Essence de braise"
deps = ["enclume"]
taches = ["item irons_spellbooks:cinder_essence 4"]
recompenses = ["xp 5"]
description = """
Les &cChevaliers anciens&r la lâchent. Ils dorment dans les &7tas d'armure&r du Nether : casser le tas réveille le chevalier. L'essence de braise entre dans les orbes, le chaudron d'alchimiste et l'appel qui réveille Tyros.
"""

[[quete]]
cle = "orbe"
titre = "Un Orbe d'amélioration vide"
deps = ["mithril", "braise"]
taches = ["item irons_spellbooks:upgrade_orb"]
recompenses = ["xp 8"]
description = """
Quatre lingots arcaniques (huit essences autour d'un lingot de fer, de cuivre ou d'or), quatre essences de braise, un lingot de mithril : l'&dorbe vide&r. Seul, il ne sert à rien ; entouré de huit runes, il devient l'orbe d'un attribut.
"""

[[quete]]
cle = "orbe_ecole"
titre = "Un orbe d'école"
deps = ["orbe", "rune_feu"]
taches = ["item irons_spellbooks:fire_upgrade_orb"]
recompenses = ["xp 8"]
description = """
Huit runes autour d'un orbe vide : ici l'&cOrbe d'amélioration de feu&r. À l'enclume arcanique, il améliore une armure ou un grimoire dans cet attribut. Les orbes de mana, de récupération et de protection suivent la même recette avec leur rune.
"""

[[quete]]
cle = "codex"
titre = "Le Codex ancien"
deps = ["enchante"]
boss = true
forme = "diamond"
taches = ["item irons_spellbooks:netherite_spell_book"]
recompenses = ["xp 15"]
description = """
Un lingot de nétherite, un &7Livre en ruine&r des cités anciennes, du tissu arcanique, une fiole de sang et une bouteille d'éclair : le &5Codex ancien&r, le meilleur grimoire que l'on fabrique. Les autres grands grimoires ne se fabriquent pas : le Necronomicon se prend au Roi Mort, le Grimoire d'évocation aux évocateurs, le Manuel du Blaze aux blazes, le Grimoire en peau de dragon demande la peau de l'Ender Dragon.
"""

[[quete]]
cle = "guerre"
titre = "Les robes du Mage de guerre"
deps = ["sorcier"]
optionnel = true
taches = ["item irons_spellbooks:netherite_mage_chestplate"]
recompenses = ["xp 8"]
description = """
À la table de forge : une pièce de sorcier, un modèle d'amélioration en nétherite, un lingot de nétherite. Les robes du &8Mage de guerre&r, la version blindée de la tenue de sorcier.
"""

[[quete]]
cle = "chaudron"
titre = "Un Chaudron d'alchimiste"
deps = ["braise"]
optionnel = true
taches = ["item irons_spellbooks:alchemist_cauldron"]
recompenses = ["xp 5"]
description = """
Un chaudron, du fer, une essence arcanique et une essence de braise. Le &5Chaudron d'alchimiste&r recycle les parchemins inutiles (une chance sur deux sur ce serveur), tire le sang des créatures, et peut aussi brasser des potions (autorisé ici).
"""

[[quete]]
cle = "portail"
titre = "Des Cadres de portail"
deps = ["mithril"]
optionnel = true
taches = ["item irons_spellbooks:portal_frame 2"]
recompenses = ["xp 5"]
description = """
Mithril, lingots arcaniques, perle de l'End : deux &5Cadres de portail&r par recette, que le sort Portail relie entre eux. Sur ce serveur, seul le propriétaire d'un cadre peut le teindre ; n'importe qui peut le casser — à poser dans le claim.
"""

# ---- le monde
[[quete]]
cle = "carte"
titre = "Une carte enroulée"
deps = ["braise"]
optionnel = true
taches = ["item irons_spellbooks:furled_map_citadel"]
recompenses = ["xp 5"]
description = """
Les &dcartes enroulées&r mènent à une structure donnée ; on les trouve, on les échange, ou on les fabrique. Celle de la &7Citadelle&r : du papier, deux essences de braise, deux fragments de savoir ancien. La citadelle est le repaire des Chevaliers anciens.
"""

[[quete]]
cle = "tour"
titre = "Une tour de mage"
deps = ["parchemin"]
optionnel = true
taches = ["structure irons_spellbooks:pyromancer_tower"]
recompenses = ["xp 5"]
description = """
Chaque structure magique abrite un mage qui ne te laissera pas faire : la tour du &cPyromancien&r, la tour de montagne, la hutte des mangroves, la tanière des araignées de glace, le fort de l'Archévocateur. C'est là que sont l'essence, les encres, les runes et les parchemins.
"""

[[quete]]
cle = "fort"
titre = "Le fort de l'Archévocateur"
deps = ["tour"]
optionnel = true
taches = ["structure irons_spellbooks:evoker_fort"]
recompenses = ["xp 5"]
description = """
L'&aArchévocateur&r tient un fort avec des villageois captifs. Les libérer vaut la reconnaissance des villages — et, selon le guide du mod, finit par mettre une &fBible du villageois&r entre tes mains, un grimoire sacré qui ne se fabrique pas.
"""

[[quete]]
cle = "catacombes"
titre = "Les Catacombes"
deps = ["enclume"]
taches = ["structure irons_spellbooks:catacombs"]
recompenses = ["xp 8"]
description = """
Un labyrinthe souterrain de zombies, de pièges et de coffres fermés à clé — les &7clés d'os&r ouvrent ses chambres fortes. Au fond repose le corps du &4Roi Mort&r.
"""

[[quete]]
cle = "roi_mort"
titre = "&4Vaincre le Roi Mort"
deps = ["catacombes"]
boss = true
forme = "diamond"
taille = 1.5
taches = ["kill irons_spellbooks:dead_king"]
recompenses = ["xp 20"]
description = """
Un clic droit sur le corps le relève. Le &4Roi Mort&r est le mage du sang : nécromancie, barrages, deux phases. Il lâche le &5Necronomicon&r et son &4Bâton de sang&r, le sceptre d'invocation que le guide du mod qualifie d'inégalé. Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "appel"
titre = "Un Invocateur d'âme de braise"
deps = ["braise"]
taches = ["item irons_spellbooks:cinderous_soulcaller"]
recompenses = ["xp 8"]
description = """
Quatre essences de braise, quatre fragments de nétherite, un éclat d'écho. L'&cInvocateur d'âme de braise&r appelle l'&cÉcho de Tyros&r ; utilisé au mauvais endroit, il répond « rien ne fait écho ».
"""

[[quete]]
cle = "tyros"
titre = "&cVaincre l'Écho de Tyros"
deps = ["appel"]
boss = true
forme = "diamond"
taille = 1.5
taches = ["kill irons_spellbooks:fire_boss"]
recompenses = ["xp 20"]
description = """
Le &cPremier Porteur de flamme&r, mage de feu et combattant. Sa mort est annoncée dans #faits-d-armes. Le staff n'a pas touché à ses points de vie ni à sa puissance (config du serveur à zéro).
"""

[[quete]]
cle = "hazen"
titre = "Hazen 'n Stuff"
deps = ["orbe"]
optionnel = true
icone = "hazennstuff:eldritch_rune"
taches = ["item hazennstuff:eldritch_rune"]
recompenses = ["xp 5"]
description = """
&dHazen 'n Stuff&r prolonge Iron's Spells : des runes et des orbes d'attributs nouveaux (radiance, ombre, mêlée, archerie, santé, et une &8rune indicible&r), des armures de mage (Séraphin, Blazeborne, Souverain cryogénique, Rôdeur du tonnerre, Alchimiste suprême…) et des armes qui résonnent avec la forge à parchemins. Les recettes sont dans JEI.
"""

[[quete]]
cle = "fin"
titre = "&5Archimage"
deps = ["codex", "orbe_ecole", "roi_mort"]
taille = 1.5
icone = "irons_spellbooks:netherite_spell_book"
taches = ["checkmark Mon grimoire est plein"]
recompenses = ["xp 10"]
description = """
Un Codex ancien plein, des robes d'école améliorées, deux boss au tableau. Le chapitre &7Grimoire&r de l'Encyclopédie liste chaque sort du pack ; l'&7Armurerie&r, chaque robe.
"""
