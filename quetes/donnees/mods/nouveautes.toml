# Chapitre vivant « Nouveautés du pack » — cahier des charges §5.22
# Reçoit les quêtes des mods ajoutés après le vote du dimanche, pour ne
# pas bousculer les autres chapitres. Une section par version, la plus
# récente en premier. Ne jamais supprimer une quête : la déplacer dans
# son chapitre définitif à la version suivante, et laisser ici un renvoi.
# Sources (5 octobre 2026) : decisions.md du dépôt (v61 du 4 octobre :
# Simple Voice Chat 2.6.22, Lootr 0.7.35.94, Open Parties and Claims
# retiré), voicechat-server.properties du serveur (48 blocs, 24 en
# chuchotant, groupes autorisés, enregistrement autorisé), lootr-common
# (coffres et barils en bois convertis, pas de décomposition ni de
# réassort, cadres d'élytres convertis en coffre, wagonnets de mine
# convertis).

[chapitre]
titre = "&dNouveautés du pack"
fichier = "mods_nouveautes"
groupe = "mods"
icone = "minecraft:nether_star"
ordre = 22

[[quete]]
cle = "intro"
titre = "&dCe qui vient d'arriver"
sous_titre = "Le vote du dimanche décide. Annonces dans #annonces."
taille = 1.5
icone = "minecraft:nether_star"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Chaque mod ajouté après un vote arrive d'abord ici, avec sa quête. À la version suivante, elle rejoint son chapitre définitif et un renvoi reste à sa place.
"""

# ---- v61 — 4 octobre 2026
[[quete]]
cle = "v61"
titre = "&dVersion 61"
deps = ["intro"]
taille = 1.3
icone = "lootr:lootr_chest"
taches = ["checkmark Mis à jour en v61"]
recompenses = ["xp 2"]
description = """
Vocal de proximité (Simple Voice Chat) et coffres par joueur (Lootr). Les claims passent entièrement par FTB Chunks : Open Parties and Claims est retiré.
"""

[[quete]]
cle = "v61_vocal"
titre = "Parler à côté"
deps = ["v61"]
taches = ["checkmark Vocal testé"]
recompenses = ["xp 3"]
description = """
On s'entend à &l48 blocs&r, 24 en chuchotant (config du serveur). Les &lgroupes&r sont autorisés : un groupe de faction s'entend à toute distance. Le réglage de la touche et du micro est au chapitre &eBienvenue&r.
"""

[[quete]]
cle = "v61_lootr"
titre = "Un baril par joueur"
deps = ["v61"]
taches = ["observation block lootr:lootr_barrel"]
recompenses = ["xp 3"]
description = """
&6Lootr&r convertit coffres, barils, coffres piégés et wagonnets de mine des structures : chacun y trouve &lson&r butin. Un coffre déjà ouvert avant la v61 n'est pas converti (le jeu a effacé sa table). Pas de réassort ni de disparition sur ce serveur (config). Le coffre d'élytres des cités de l'End devient un coffre, avec des élytres garanties.
"""
