# Chapitre « Create — logistique et trains » — cahier des charges §5.3
# Recettes lues dans create-1.20.1-6.0.8.jar (data/create/recipes).

[chapitre]
titre = "&bCreate — logistique et trains"
fichier = "create_logistique"
groupe = "mods"
icone = "create:stock_ticker"
ordre = 2

[[quete]]
cle = "intro"
titre = "&bCreate 6 : des colis et des rails"
sous_titre = "Après la fabrication avancée."
taille = 1.5
icone = "create:cardboard_block"
taches = ["checkmark Lu"]
recompenses = ["item minecraft:paper 16"]
description = """
Create 6 ajoute une poste : des &6colis&r en carton qui circulent sur les courroies, des emballeurs qui les font, des liens de stock qui savent ce que contient chaque coffre, et un guichet pour commander. Puis les &btrains&r, pour relier deux bases.

Le papier offert devient de la pâte, puis du carton : c'est le premier maillon.
"""

[[quete]]
cle = "carton"
titre = "Du carton"
racine = true
taches = ["item create:cardboard 8"]
recompenses = ["xp 3"]
description = """
La presse écrase la &7pâte à papier&r en &7carton&r. Quatre cartons font un bloc de carton, et le bloc de carton est le cœur de l'emballeur.
"""

[[quete]]
cle = "emballeur"
titre = "Un emballeur"
deps = ["carton"]
taille = 1.3
taches = ["item create:packager"]
recompenses = ["xp 5"]
description = """
Bloc de carton, quatre lingots de fer, deux redstone. Collé à un coffre ou à une cuve d'objets, l'&bemballeur&r en sort des &6colis&r sur un signal redstone, et déballe les colis qu'on lui apporte. Un colis se promène sur une courroie comme n'importe quel objet, mais il porte une adresse.
"""

[[quete]]
cle = "lien"
titre = "Un lien de stock"
racine = true
taches = ["item create:stock_link"]
recompenses = ["xp 3"]
description = """
Émetteur sur cuve d'objets. Posé sur un emballeur, le &blien de stock&r déclare à un réseau ce que l'inventaire derrière contient. Tous les liens à la même fréquence forment un seul stock.
"""

[[quete]]
cle = "guichet"
titre = "Un guichet de stock"
deps = ["lien", "emballeur"]
taille = 1.3
taches = ["item create:stock_ticker"]
recompenses = ["xp 8"]
description = """
Verre, lien de stock, lingot d'or. Le &bguichet&r affiche tout ce que les liens de son réseau connaissent, et on y &lcommande&r : les emballeurs concernés préparent les colis, les courroies les apportent. Un villageois ou un bras posé devant tient la caisse.
"""

[[quete]]
cle = "jauge"
titre = "Des jauges d'usine"
deps = ["lien"]
taches = ["item create:factory_gauge 2"]
recompenses = ["xp 5"]
description = """
Lien de stock et mécanisme de précision : deux &bjauges&r. Chaque jauge surveille un objet et un seuil ; en dessous, elle commande elle-même ce qu'il faut aux emballeurs pour le fabriquer. Enchaînées, elles font une usine qui se réapprovisionne seule.
"""

[[quete]]
cle = "grenouille"
titre = "Un port à colis"
deps = ["emballeur"]
taches = ["item create:package_frogport"]
recompenses = ["xp 3"]
description = """
Boule de slime, cuve d'objets, alliage. Le &bport à colis&r avale les colis à son adresse depuis une chaîne de convoyeur, et les rend à l'emballeur qui déballe. Sa langue dit où il regarde.
"""

[[quete]]
cle = "chaine"
titre = "Une chaîne de convoyeur"
deps = ["grenouille"]
taches = ["item create:chain_conveyor 2"]
recompenses = ["xp 5"]
description = """
Grand engrenage dans quatre boîtiers d'andésite : deux &bconvoyeurs à chaîne&r. Reliés par une chaîne, ils font voyager les colis dans les airs sur de longues distances, d'un port à l'autre.
"""

[[quete]]
cle = "demandeur"
titre = "Un demandeur redstone"
deps = ["lien"]
taches = ["item create:redstone_requester"]
recompenses = ["xp 3"]
description = """
Redstone, lien de stock, fer. Le &bdemandeur&r passe une commande fixe quand il reçoit un signal : un bouton, et les objets arrivent.
"""

[[quete]]
cle = "interrupteur"
titre = "Un interrupteur de stock"
racine = true
taches = ["item create:stockpile_switch"]
recompenses = ["xp 3"]
description = """
Tube électronique, boîtier de laiton, comparateur. L'&7interrupteur de stock&r émet un signal selon le remplissage de l'inventaire devant lui, entre deux seuils qu'on règle. C'est lui qui arrête une machine quand le coffre est plein.
"""

[[quete]]
cle = "boitier_rail"
titre = "Des boîtiers ferroviaires"
racine = true
taches = ["item create:railway_casing 4"]
recompenses = ["xp 3"]
description = """
Un boîtier de laiton frappé avec une plaque d'obsidienne. Tout le matériel de train part de là : station, commandes, portes, signaux.
"""

[[quete]]
cle = "voie"
titre = "Poser des voies"
deps = ["boitier_rail"]
taille = 1.3
taches = ["item create:track 32"]
recompenses = ["xp 8"]
description = """
Les &bvoies&r se font par assemblage séquencé : une voie incomplète passe sous des déployeurs qui posent des pépites de fer ou de zinc. Elles se posent en courbes, en pentes et en diagonales, et se raccordent d'elles-mêmes.
"""

[[quete]]
cle = "station"
titre = "Une station"
deps = ["voie"]
taches = ["item create:track_station"]
recompenses = ["xp 5"]
description = """
Boîtier ferroviaire et boussole : deux &bstations&r. Posée au bord d'une voie, c'est là qu'on assemble un train, qu'il s'arrête et que l'horaire lui dit où aller.
"""

[[quete]]
cle = "commandes"
titre = "Des commandes de train"
deps = ["station"]
taches = ["item create:controls"]
recompenses = ["xp 5"]
description = """
Levier, boîtier ferroviaire, mécanisme de précision. Les &bcommandes&r se posent sur le train assemblé : on monte, on conduit. Sans elles, le train ne part qu'avec un horaire.
"""

[[quete]]
cle = "train"
racine = true
titre = "Assembler un train"
boss = true
forme = "diamond"
taches = ["advancement create:train"]
recompenses = ["xp 10"]
description = """
Un bogie sur la voie à la station, des blocs collés dessus, des commandes, et le bouton d'assemblage de la station. Le train existe. Il avance avec les commandes ou avec un &7horaire&r (plaque d'obsidienne et papier) glissé dans les commandes.
"""

[[quete]]
cle = "signal"
titre = "Des signaux"
deps = ["voie"]
taches = ["item create:track_signal 4", "item create:track_observer 2"]
recompenses = ["xp 5"]
description = """
Boîtier ferroviaire et tube électronique : quatre &7signaux&r. Ils découpent la voie en sections et empêchent deux trains d'y entrer ensemble. L'&7observateur de voie&r, lui, émet un signal redstone au passage d'un train.
"""

[[quete]]
cle = "porte"
titre = "Une porte de train"
deps = ["boitier_rail"]
taches = ["item create:train_door"]
recompenses = ["xp 3"]
description = """
Une porte en bois et un boîtier ferroviaire. Elle s'ouvre toute seule quand le train est à quai, et reste fermée en route.
"""

[[quete]]
cle = "affichage"
titre = "Un panneau d'affichage"
racine = true
taches = ["item create:display_board 2", "item create:display_link"]
recompenses = ["xp 3"]
description = """
Tube électronique entre deux alliages : deux &7panneaux&r. Avec un &7lien d'affichage&r, ils montrent le contenu d'un coffre, l'heure, les trains attendus en gare, ou le stock d'un guichet.
"""

# ---- Paliers complets (BMC-89, 5 octobre 2026) : progrès du jar
# create-1.20.1-6.0.8 (data/create/advancements, textes en_us) ; un progrès
# remplace une case à cocher dès qu'il existe.
[[quete]]
cle = "horaire"
titre = "Un horaire de train"
deps = ["train"]
optionnel = true
taches = ["advancement create:conductor"]
recompenses = ["xp 6"]
description = """
Donner un horaire à un conducteur de train (progrès « Conductor Instructor ») : le train circule seul entre les gares.
"""

[[quete]]
cle = "tableau_horaire"
titre = "Un tableau des arrivées"
deps = ["horaire"]
optionnel = true
taches = ["advancement create:display_board_0"]
recompenses = ["xp 6"]
description = """
Annoncer l'arrivée d'un train sur un tableau d'affichage, avec un lien d'affichage (progrès « Dynamic Timetables »).
"""

[[quete]]
cle = "sifflet_train"
titre = "Un sifflet de train"
deps = ["train"]
optionnel = true
taches = ["advancement create:train_whistle"]
recompenses = ["xp 4"]
description = """
Un sifflet à vapeur monté sur le train, actionné en roulant (progrès « Choo Choo ! »).
"""

[[quete]]
cle = "train_portail"
titre = "Un train à travers un portail"
deps = ["train"]
optionnel = true
taches = ["advancement create:train_portal"]
recompenses = ["xp 8"]
description = """
Passer un portail à bord d'un train (progrès « Dimensional Commuter ») : les lignes peuvent relier le Nether.
"""

[[quete]]
cle = "train_long"
titre = "&6Un train de six wagons"
deps = ["horaire"]
optionnel = true
forme = "diamond"
taches = ["advancement create:long_train"]
recompenses = ["xp 12"]
description = """
Un train d'au moins six wagons (progrès « Ambitious Endeavours »).
"""

[[quete]]
cle = "grand_voyage"
titre = "&6&lUn réseau de 5 000 blocs"
deps = ["train_long"]
optionnel = true
forme = "diamond"
taille = 1.6
taches = ["advancement create:long_travel"]
recompenses = ["xp 25"]
description = """
Quitter un siège de train à plus de 5 000 blocs du point de départ (progrès « Field Trip ») : un vrai réseau ferré, signalisé, le sommet de la logistique avec Create.
"""

[[quete]]
cle = "demande_auto"
racine = true
titre = "Une commande automatique"
optionnel = true
taches = ["advancement create:factory_gauge"]
recompenses = ["xp 8"]
description = """
Déclencher une commande de colis automatique avec des jauges d'usine (progrès « High Logistics »).
"""

[[quete]]
cle = "grenouille_attrape"
racine = true
titre = "La grenouille attrape un colis"
optionnel = true
taches = ["advancement create:frogport"]
recompenses = ["xp 5"]
description = """
Une grenouille portuaire attrape un colis sur un convoyeur à chaîne (progrès « Hungry hoppers »).
"""

[[quete]]
cle = "guichet_employe"
racine = true
titre = "Un employé au guichet"
optionnel = true
taches = ["advancement create:stock_ticker"]
recompenses = ["xp 5"]
description = """
Placer une créature au guichet de stock et passer les premières commandes (progrès « Order Up ! »).
"""

[[quete]]
cle = "nappe"
racine = true
titre = "Une boutique sur nappe"
optionnel = true
taches = ["advancement create:table_cloth_shop"]
recompenses = ["xp 4"]
description = """
Mettre des objets en vente sur une nappe (progrès « Open for business »).
"""

[[quete]]
cle = "fin"
titre = "&bLa poste et le chemin de fer"
deps = ["guichet", "train"]
taille = 1.5
icone = "create:track_station"
taches = ["checkmark Colis livrés, train parti"]
recompenses = ["xp 10"]
description = """
Un guichet qui commande, des colis qui arrivent, un train qui relie. C'est tout Create 6. Le reste du mod se découvre dans l'Encyclopédie, chapitre &7Atelier Create&r.
"""
