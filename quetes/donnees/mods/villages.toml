Un &lbac à fleurs&r, dans n'importe quel bois.
"""

# ---- gardes et commerce
[[quete]]
cle = "garde"
titre = "Recruter un garde"
racine = true
optionnel = true
taches = ["advancement minecraft:adventure/recruit_guard"]
recompenses = ["xp 5"]
description = """
&7Guard Villagers&r : donner une épée à un villageois sans emploi en fait un garde (progrès du mod).
"""

[[quete]]
cle = "comptoir"
titre = "Un comptoir d'échange"
deps = ["echange"]
taches = ["item tradingpost:trading_post"]
recompenses = ["xp 8"]
description = """
Le &6Trading Post&r regroupe les échanges de tous les villageois à portée dans un seul écran, avec une recherche. S'il dit qu'aucun marchand n'est disponible, rapproche-le.
"""

[[quete]]
cle = "troc"
titre = "Une station de troc"
racine = true
optionnel = true
taches = ["item barteringstation:bartering_station"]
recompenses = ["xp 8"]
description = """
La &6Bartering Station&r troque l'or avec les piglins à ta place.
"""

[[quete]]
cle = "gobelin"
titre = "Le gobelin marchand"
deps = ["intro"]
optionnel = true
taches = ["observation entity goblintraders:goblin_trader"]
recompenses = ["xp 5"]
description = """
&2Goblin Traders&r : un gobelin sous terre, entre Y -64 et 50 (config du serveur), avec des échanges rares, dont des potions de hâte, d'absorption et de grâce du dauphin. Il se réassortit tous les deux jours. On ne peut pas le porter (Carry On).
"""

[[quete]]
cle = "gobelin_veines"
titre = "Le gobelin des veines"
deps = ["gobelin"]
optionnel = true
taches = ["observation entity goblintraders:vein_goblin_trader"]
recompenses = ["xp 5"]
description = """
Son cousin du Nether, entre Y 0 et 128 (config).
"""

# ---- Raids. raided-common.toml du serveur (lu le 5 octobre) : les cinq
# illageois de Raided activés, apparitions par vague (index = numéro de
# vague, comme les tableaux du jeu de base) : électromancien 1, 3, 5 ;
# nécromancien 2, 5 ; inquisiteur 3 ; savager 3, 6 ; incinérateur 4, 7.
# server.properties : difficulty=normal (cinq vagues, plus une vague bonus
# avec un Mauvais présage renforcé).
[[quete]]
cle = "exil"
titre = "Abattre un capitaine"
racine = true
optionnel = true
taches = ["advancement minecraft:adventure/voluntary_exile"]
recompenses = ["xp 5"]
description = """
Le capitaine d'une patrouille ou d'un avant-poste porte une bannière. L'abattre donne le &cMauvais présage&r : la prochaine entrée dans un village déclenche un raid.
"""

[[quete]]
cle = "heros"
titre = "&cHéros du village"
deps = ["exil"]
optionnel = true
taches = ["advancement minecraft:adventure/hero_of_the_village"]
recompenses = ["xp 10"]
description = """
Repousser toutes les vagues d'un raid. Sur ce serveur, en difficulté normale, un raid compte cinq vagues, plus une vague bonus quand le présage est renforcé.
"""

[[quete]]
cle = "raided"
titre = "&cLes illageois de Raided"
deps = ["heros"]
optionnel = true
taches = ["kill raided:electromancer", "kill raided:necromancer", "kill raided:inquisitor", "kill raided:savager", "kill raided:incinerator"]
recompenses = ["xp 15"]
description = """
&cRaided&r ajoute cinq illageois aux raids, activés sur ce serveur. L'électromancien arrive dès la première vague, le nécromancien à la deuxième, l'inquisiteur et le « Savager » à la troisième, l'incinérateur à la quatrième. Il faut donc tenir au moins quatre vagues pour les croiser tous.
"""

[[quete]]
cle = "echanges_50"
titre = "Cinquante échanges"
deps = ["echange"]
taches = ["stat minecraft:traded_with_villager 50"]
recompenses = ["xp 5"]
description = """
Cinquante échanges avec les villageois (statistique du jeu). Un villageois qui échange monte en niveau : novice, apprenti, compagnon, expert, maître.
"""

[[quete]]
cle = "echanges_250"
titre = "Deux cent cinquante échanges"
deps = ["echanges_50", "echange"]
taille = 1.5
forme = "diamond"
taches = ["stat minecraft:traded_with_villager 250"]
recompenses = ["xp 10"]
description = """
Assez pour amener plusieurs villageois jusqu'au rang de maître. Le comptoir de Trading Post rassemble les offres des marchands proches.
"""

[[quete]]
cle = "raids_5"
titre = "Cinq raids gagnés"
deps = ["heros"]
optionnel = true
taches = ["stat minecraft:raid_win 5"]
recompenses = ["xp 15"]
description = """
Cinq raids repoussés (statistique du jeu). Les vagues comptent les illageois des mods du serveur.
"""

[[quete]]
cle = "fin"
titre = "&6Marchand"
deps = ["echanges_250"]
taille = 1.3
icone = "minecraft:emerald_block"
taches = ["checkmark Mon village tourne"]
recompenses = ["xp 5"]
