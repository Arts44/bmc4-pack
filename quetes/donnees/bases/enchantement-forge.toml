deps = ["ornement"]
optionnel = true
taches = ["item minecraft:wayfinder_armor_trim_smithing_template", "item minecraft:shaper_armor_trim_smithing_template", "item minecraft:raiser_armor_trim_smithing_template", "item minecraft:host_armor_trim_smithing_template"]
recompenses = ["xp 10"]
description = """
Guide, Façonneur, Éleveur, Hôte : au pinceau, dans le gravier suspect.
"""

[[quete]]
cle = "exclusifs"
titre = "&dLes ornements exclusifs"
deps = ["ornement"]
optionnel = true
taille = 1.3
taches = ["advancement minecraft:adventure/trim_with_all_exclusive_armor_patterns"]
recompenses = ["xp 30"]
description = """
Les huit modèles qui ne se trouvent qu'une fois par structure, tous posés (progrès « Smithing with Style »).
"""

[[quete]]
cle = "enchanter"
racine = true
titre = "Un premier enchantement"
taches = ["advancement minecraft:story/enchant_item"]
recompenses = ["xp 3"]
description = """
Un objet enchanté à la table (progrès du jeu).
"""

[[quete]]
cle = "armure_fer"
titre = "Une pièce de fer"
racine = true
