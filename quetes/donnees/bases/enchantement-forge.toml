# Chapitre « Enchantement et forge » — cahier des charges §9.1.6
# R0. Le vanilla ; la version du pack (Easy Magic, Easy Anvils, infuseur,
# tome d'XP) est au chapitre Enchantement des mods. Seize modèles
# d'ornement vanilla et leur structure d'origine (jeu de base) ; progrès
# trim_with_any_armor_pattern et trim_with_all_exclusive_armor_patterns.
# Rappel BMC-60 : seuls les matériaux présents dans le pack s'affichent.

[chapitre]
titre = "&dEnchantement et forge"
fichier = "bases_enchantement_forge"
groupe = "bases"
icone = "minecraft:enchanting_table"
ordre = 6

[[quete]]
cle = "intro"
titre = "&dLa table, l'enclume, la forge"
taille = 1.5
icone = "minecraft:anvil"
taches = ["checkmark Lu"]
recompenses = ["item minecraft:lapis_lazuli 16"]
description = """
Le vanilla, pas à pas. Ce que le pack y change (Easy Magic, Easy Anvils, l'infuseur) est au chapitre &dEnchantement&r des mods.
"""

[[quete]]
cle = "table"
titre = "La table d'enchantement"
deps = ["intro"]
taches = ["item minecraft:enchanting_table", "item minecraft:bookshelf 15"]
recompenses = ["xp 3"]
description = """
Obsidienne, diamants, un livre. Quinze bibliothèques à un bloc d'écart pour le niveau 30. Le lapis paie, les niveaux aussi.
"""

[[quete]]
cle = "livre"
titre = "Un livre enchanté"
deps = ["table"]
taches = ["item minecraft:enchanted_book"]
recompenses = ["xp 2"]
description = """
Enchanter un livre garde l'enchantement pour plus tard. Les bibliothécaires en vendent.
"""

[[quete]]
cle = "enclume"
titre = "L'enclume"
deps = ["livre"]
taches = ["item minecraft:anvil"]
recompenses = ["xp 3"]
description = """
Trois blocs de fer et quatre lingots. Elle combine, répare, renomme, et s'use.
"""

[[quete]]
cle = "meule"
titre = "La meule"
deps = ["intro"]
taches = ["item minecraft:grindstone"]
recompenses = ["xp 2"]
description = """
Elle retire les enchantements et rend un peu d'XP. Les malédictions restent.
"""

[[quete]]
cle = "forgeron"
titre = "La table de forgeron"
deps = ["intro"]
taches = ["item minecraft:smithing_table"]
recompenses = ["xp 2"]
description = """
Un modèle, une pièce, un matériau : c'est là qu'on passe à la nétherite et qu'on pose un ornement.
"""

[[quete]]
cle = "netherite"
titre = "Le modèle de nétherite"
deps = ["forgeron"]
taches = ["item minecraft:netherite_upgrade_smithing_template"]
recompenses = ["xp 5"]
description = """
Dans les bastions. Il se recopie : sept diamants et un bloc de roche du Nether autour du modèle.
"""

[[quete]]
cle = "ornement"
titre = "Un premier ornement"
deps = ["forgeron"]
taches = ["advancement minecraft:adventure/trim_with_any_armor_pattern"]
recompenses = ["xp 3"]
description = """
Un modèle d'ornement, une pièce d'armure, un matériau (progrès vanilla). Seuls les matériaux présents dans le pack s'affichent sur l'armure.
"""

# ---- les seize modèles
[[quete]]
cle = "sentinelle"
titre = "Sentinelle"
deps = ["ornement"]
