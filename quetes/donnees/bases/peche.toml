# Chapitre « Pêche et océan » — cahier des charges §9.1.2
# R0. Sources (5 octobre 2026) : objets et progrès vanilla de l'index
# (fishy_business, tactical_fishing, axolotl_in_a_bucket,
# kill_axolotl_target), Ocean's Delight et Crabber's Delight (objets de
# l'index, progrès craft_crab_trap et get_pearl du lang Crabber's). La
# cuisine de la mer détaillée est au chapitre Cuisine.

[chapitre]
titre = "&bPêche et océan"
fichier = "bases_peche"
groupe = "bases"
icone = "minecraft:fishing_rod"
ordre = 2

[[quete]]
cle = "intro"
titre = "&bAu bord de l'eau"
taille = 1.5
icone = "minecraft:cod"
taches = ["checkmark Lu"]
recompenses = ["item minecraft:fishing_rod"]
description = """
La canne, les trésors qui mordent, les bêtes de l'eau, et deux mods de cuisine marine. Sous la pluie, ça mord plus vite.
"""

[[quete]]
cle = "pecher"
titre = "Premier poisson"
racine = true
taches = ["advancement minecraft:husbandry/fishy_business"]
recompenses = ["xp 2"]
description = """
Attraper un poisson à la canne (progrès vanilla). Morue, saumon, poisson tropical, poisson-globe.
"""

[[quete]]
cle = "quatre"
titre = "Les quatre poissons"
deps = ["pecher"]
taches = ["item minecraft:cod", "item minecraft:salmon", "item minecraft:tropical_fish", "item minecraft:pufferfish"]
recompenses = ["xp 3"]
description = """
Le poisson-globe empoisonne cru ; il sert à la potion de respiration aquatique.
"""

[[quete]]
cle = "tresor"
titre = "Un trésor de pêche"
deps = ["pecher"]
optionnel = true
taches = ["item minecraft:nautilus_shell"]
recompenses = ["xp 5"]
description = """
Les trésors de la canne : livres enchantés, selles, arcs, étiquettes, et la &lcoquille de nautile&r. Les enchantements Chance de la mer et Appât changent les probabilités.
"""

[[quete]]
cle = "seau"
titre = "Pêche tactique"
deps = ["pecher"]
optionnel = true
taches = ["advancement minecraft:husbandry/tactical_fishing"]
recompenses = ["xp 3"]
description = """
Un poisson vivant dans un seau (progrès vanilla).
"""

[[quete]]
cle = "axolotl"
titre = "Un axolotl"
deps = ["seau"]
optionnel = true
taches = ["advancement minecraft:husbandry/axolotl_in_a_bucket"]
recompenses = ["xp 5"]
description = """
Dans les grottes luxuriantes. En seau, il te suit ; au combat, il te soigne quand il gagne (progrès « The Healing Power of Friendship »).
"""

[[quete]]
cle = "tortues"
titre = "Les tortues"
racine = true
optionnel = true
taches = ["item minecraft:scute 5"]
recompenses = ["xp 5"]
description = """
Les œufs éclosent sur leur plage natale ; le bébé perd une écaille en grandissant. Cinq écailles font le casque de tortue.
"""

[[quete]]
cle = "dauphins"
titre = "Les dauphins"
deps = ["intro"]
optionnel = true
taches = ["checkmark Grâce du dauphin reçue"]
recompenses = ["xp 2"]
description = """
Nager près d'eux donne leur grâce ; nourris de poisson, ils mènent au trésor le plus proche.
"""

[[quete]]
cle = "monument"
titre = "Le monument sous-marin"
deps = ["intro"]
optionnel = true
taches = ["structure minecraft:monument"]
recompenses = ["xp 5"]
description = """
Gardiens, trois gardiens anciens, éponges et prismarine. YUNG's Better Ocean Monuments le remanie.
"""

[[quete]]
cle = "conduit"
titre = "Un conduit"
deps = ["tresor"]
optionnel = true
taille = 1.3
taches = ["item minecraft:conduit"]
recompenses = ["xp 15"]
description = """
Un cœur de la mer et huit coquilles de nautile. Entouré de prismarine, il donne respiration, vision et vitesse de minage sous l'eau, et attaque les hostiles.
"""

[[quete]]
cle = "casier"
racine = true
doublon_voulu = true
titre = "Un casier à crabes"
optionnel = true
taches = ["item crabbersdelight:crab_trap"]
recompenses = ["xp 3"]
description = """
&bCrabber's Delight&r : corde, dalles, bâtons (progrès du mod). Posé dans l'eau, il attrape crabes, crevettes, palourdes. Une palourde sur la planche à découper peut donner une &lperle&r (progrès du mod).
"""

[[quete]]
cle = "soupe"
racine = true
doublon_voulu = true
titre = "Une soupe de gardien"
optionnel = true
taches = ["item oceansdelight:guardian_soup"]
recompenses = ["xp 5"]
description = """
&bOcean's Delight&r cuisine les gardiens, les tentacules et les concombres de mer. Le détail au chapitre &7Cuisine&r.
"""

[[quete]]
cle = "cent"
titre = "&bCent poissons"
deps = ["pecher"]
taille = 1.5
forme = "diamond"
taches = ["stat minecraft:fish_caught 100"]
recompenses = ["xp 10"]
description = """
Cent prises au total (statistique du jeu). Les trésors, livres enchantés et coquilles de nautile sortent de la même canne.
"""

[[quete]]
cle = "fin"
titre = "&bMarin"
deps = ["cent"]
taille = 1.3
icone = "minecraft:heart_of_the_sea"
taches = ["checkmark Marin"]
recompenses = ["xp 5"]
