# MysticalAgriculture-1.20.1-7.0.24 (recettes, ModAugments et classes
# d'augment lus en javap), mysticalagriculture-common.toml du serveur.
# Contrôlé par generer.py (controler_paliers) : chaque palier a sa quête,
# chaque palier dépend du précédent de son échelle, le sommet est le dernier.
