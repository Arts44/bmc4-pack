# Chapitre « Donjons et autres boss » — cahier des charges §4.12
# Sources (5 octobre 2026) : progrès find_* de When Dungeons Arise (jar
# 2.1.58, descriptions lues), entités et autels de Stalwart Dungeons
# (index), Illager Invasion (Invoker : raids, RaidWavesConfigHelper),
# Alex's Mobs (ver mystérieux, voidWormSpawnDimensions = ["minecraft:the_end"]
# dans alexsmobs.toml du serveur, œil de ver du vide), Bountiful (tableau de
# primes, décret ; progrès absents de l'index, case à cocher), Galosphere
# (Berserker : progrès summon_berserker, critère summoned_entity, en échec
# au chargement serveur, donc tâche « tuer »). Les trois autels de Stalwart
# existent en blocs (blockstates du jar). Dead King et Tyros : chapitre Iron's Spells.

[chapitre]
titre = "&8Donjons et autres boss"
fichier = "monde_donjons"
groupe = "monde"
icone = "bountiful:bountyboard"
ordre = 12

[[quete]]
cle = "intro"
titre = "&8Ce qui reste à abattre"
sous_titre = "Guide dans #donjons sur le Discord."
taille = 1.5
icone = "minecraft:iron_sword"
taches = ["checkmark Lu"]
recompenses = ["item minecraft:arrow 32"]
description = """
Les donjons de &bWhen Dungeons Arise&r, ceux de &cStalwart Dungeons&r et leurs trois boss, l'&cInvoker&r d'Illager Invasion, le &5Ver du vide&r, le &dBerserker&r de Galosphere, et les primes de &bBountiful&r. Le Roi Mort et Tyros sont au chapitre Iron's Spells.
"""

# ---- When Dungeons Arise
[[quete]]
cle = "wda_fort"
titre = "Le fort des illageois"
deps = ["intro"]
taches = ["advancement dungeons_arise:find_illager_fort"]
recompenses = ["xp 5"]
description = """
&bWhen Dungeons Arise&r pose trente-neuf structures. Le fort des illageois est l'une des grandes : plusieurs étages, des générateurs, des coffres par joueur.
"""

[[quete]]
cle = "wda_tours"
titre = "Les tours des bandits"
deps = ["intro"]
optionnel = true
taches = ["advancement dungeons_arise:find_bandit_towers"]
recompenses = ["xp 5"]
description = """
Les tours des bandits (progrès du mod).
"""

[[quete]]
cle = "wda_asile"
titre = "L'asile de la peste"
deps = ["intro"]
optionnel = true
taches = ["advancement dungeons_arise:find_plague_asylum"]
recompenses = ["table aventurier"]
description = """
L'asile de la peste (progrès du mod). &aJalon Aventurier.&r
"""

[[quete]]
cle = "wda_palais"
titre = "Le palais de Shiraz"
deps = ["intro"]
optionnel = true
taches = ["advancement dungeons_arise:find_shiraz_palace"]
recompenses = ["xp 5"]
description = """
Le palais de Shiraz, dans le désert (progrès « Enter Sandman »).
"""

[[quete]]
cle = "wda_kayra"
titre = "Le donjon de Kayra"
deps = ["intro"]
optionnel = true
taches = ["advancement dungeons_arise:find_keep_kayra"]
recompenses = ["xp 5"]
description = """
Le donjon de Kayra (progrès du mod).
"""

[[quete]]
cle = "wda_pirates"
titre = "Le vaisseau des pirates morts-vivants"
deps = ["intro"]
optionnel = true
taches = ["advancement dungeons_arise:find_undead_pirate_ship"]
recompenses = ["xp 5"]
description = """
En mer. Le mod a aussi des corsaires et galères illageoises, un phare, des bains, une tour de Typhon (liste des progrès).
"""

[[quete]]
cle = "wda_monastere"
titre = "Le monastère"
deps = ["intro"]
optionnel = true
taches = ["advancement dungeons_arise:find_monasteries"]
recompenses = ["xp 5"]
description = """
Un monastère (progrès « A Quiet Place »).
"""

# ---- Stalwart Dungeons
[[quete]]
cle = "awful_ghast"
titre = "&cVaincre l'Awful Ghast"
deps = ["intro"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["kill stalwart_dungeons:awful_ghast"]
recompenses = ["xp 20"]
description = """
&cStalwart Dungeons&r : un &lautel de l'Awful Ghast&r (bloc du mod) l'invoque dans son donjon du Nether. Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "nether_keeper"
titre = "&cVaincre le Nether Keeper"
deps = ["intro"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["kill stalwart_dungeons:nether_keeper"]
recompenses = ["xp 20"]
description = """
Dans le Nether, derrière l'&lautel du Nether Keeper&r (bloc du mod). Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "shelterer"
titre = "&dVaincre le Shelterer"
deps = ["intro"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["kill stalwart_dungeons:shelterer"]
recompenses = ["xp 20"]
description = """
Le boss de l'End de Stalwart Dungeons, derrière son autel (bloc du mod). Sa mort est annoncée dans #faits-d-armes. Le tungstène et le chorundum du mod font armures, boucliers et outils.
"""

# ---- Illager Invasion
[[quete]]
cle = "invoker"
titre = "&cVaincre l'Invoker"
deps = ["intro"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["kill illagerinvasion:invoker"]
recompenses = ["xp 25"]
description = """
Le maître des illageois vient avec les &lraids de village&r (il fait partie des vagues, code du mod). Sa mort est annoncée dans #faits-d-armes.
"""

# ---- Alex's Mobs
[[quete]]
cle = "ver_vide"
titre = "&5Vaincre le Ver du vide"
deps = ["intro"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["item alexsmobs:void_worm_eye"]
recompenses = ["xp 25"]
description = """
Il n'apparaît pas seul : un &5ver mystérieux&r, jeté &ldans l'End&r (seule dimension autorisée sur ce serveur), l'invoque. Le ver est fait de plusieurs entités : c'est son &lœil&r, qu'il lâche, qui valide la quête. Sa mort est annoncée dans #faits-d-armes.
"""

# ---- Galosphere
[[quete]]
cle = "berserker"
titre = "&dVaincre le Berserker"
deps = ["intro"]
boss = true
forme = "diamond"
optionnel = true
taches = ["kill galosphere:berserker"]
recompenses = ["xp 15"]
description = """
Le progrès du mod s'appelle « Règne de terreur » : invoquer le Berserker. Il se joue autour du Sanctuaire du sel rose et de sa Tablette liée au sel. Sa mort est annoncée dans #faits-d-armes.
"""

# ---- Bountiful
[[quete]]
cle = "primes"
titre = "Le tableau de primes"
deps = ["intro"]
taches = ["item bountiful:bountyboard", "checkmark Trois primes prises"]
recompenses = ["xp 8"]
description = """
&bBountiful&r : un &ltableau de primes&r propose des contrats à délai. Un &ldécret&r posé dans le tableau oriente les primes (« Royal Mandate »). Trois primes prises, et la case se coche.
"""

# ---- Spawners+ 4.3.3 (mod Fabric chargé par Connector). Table de butin
# minecraft:blocks/spawner remplacée (fragments, Fortune) ; recettes du jar ;
# âmes : ModLootTableModifiers (arme Soul Stealing), taux de
# /config/spawnersplus/soul_drop_rates.json du serveur (zombie, squelette,
# araignée, zombie momifié 4 %, araignée venimeuse 7 %, blaze et creeper 5 %,
# cube de magma 2 % ; vagabond, noyé et wither squelette 0 : fabrication
# seulement ; poisson d'argent : aucune source, inobtenable).
[[quete]]
cle = "fragments"
titre = "Des fragments de générateur"
deps = ["intro"]
optionnel = true
taches = ["item spawnersplus:spawner_fragment 8"]
recompenses = ["xp 5"]
description = """
Avec &aSpawners+&r, un générateur de monstres cassé à la pioche ne disparaît plus : il lâche des fragments de générateur, plus avec Fortune. Les donjons en sont pleins.
"""

[[quete]]
cle = "generateur_inactif"
titre = "Un générateur inactif"
deps = ["fragments"]
optionnel = true
taches = ["item spawnersplus:inactive_spawner"]
recompenses = ["xp 8"]
description = """
Huit fragments en anneau : un générateur inactif, qui se casse à la pioche en fer au moins. Il attend une âme.
"""

[[quete]]
cle = "ame"
titre = "Une âme de monstre"
deps = ["generateur_inactif"]
optionnel = true
exigence = "une"
taches = ["item spawnersplus:zombie_soul", "item spawnersplus:skeleton_soul", "item spawnersplus:spider_soul", "item spawnersplus:cave_spider_soul", "item spawnersplus:husk_soul", "item spawnersplus:creeper_soul", "item spawnersplus:blaze_soul", "item spawnersplus:magma_cube_soul"]
recompenses = ["xp 8"]
description = """
Une créature tuée avec une arme enchantée « Soul Stealing » peut lâcher son âme : quatre fois sur cent pour un zombie, un squelette, une araignée ou un zombie momifié, cinq pour un blaze ou un creeper, sept pour une araignée venimeuse, deux pour un cube de magma (config du serveur). L'âme utilisée sur un générateur inactif le réveille pour cette créature.
"""

[[quete]]
cle = "ames_fabriquees"
titre = "Les âmes qui ne tombent pas"
deps = ["ame"]
optionnel = true
exigence = "une"
taches = ["item spawnersplus:stray_soul", "item spawnersplus:drowned_soul", "item spawnersplus:wither_skeleton_soul"]
recompenses = ["xp 10"]
description = """
Trois âmes ne tombent jamais sur ce serveur : elles se fabriquent. Une âme de squelette entourée de huit seaux de neige poudreuse donne celle du vagabond ; une âme de zombie et huit cœurs de la mer, celle du noyé ; une âme de squelette et huit étoiles du Nether, celle du wither squelette.
"""

[[quete]]
cle = "silencieux"
titre = "Un silencieux de générateur"
deps = ["fragments"]
optionnel = true
taches = ["item spawnersplus:spawner_silencer"]
recompenses = ["xp 5"]
description = """
Huit fragments autour d'un totem d'immortalité. Tenu en main, il coupe les générateurs proches : de quoi vider un donjon sans vagues sans fin.
"""

[[quete]]
cle = "tungstene"
titre = "Du tungstène"
deps = ["intro"]
taches = ["item stalwart_dungeons:tungsten_ingot"]
recompenses = ["xp 5"]
description = """
Le minerai de tungstène de &cStalwart Dungeons&r, fondu en lingots.
"""

[[quete]]
cle = "tungstene_armure"
titre = "L'armure de tungstène"
deps = ["tungstene"]
taches = ["item stalwart_dungeons:tungsten_helmet", "item stalwart_dungeons:tungsten_chestplate", "item stalwart_dungeons:tungsten_leggings", "item stalwart_dungeons:tungsten_boots"]
recompenses = ["xp 10"]
description = """
Chaque pièce demande des lingots de tungstène et un &ldébris d'armure de blaze&r, lâché par les blazes renforcés (table de butin du jar).
"""

[[quete]]
cle = "tungstene_outils"
titre = "Les outils de tungstène"
deps = ["tungstene"]
taches = ["item stalwart_dungeons:tungsten_sword", "item stalwart_dungeons:tungsten_pickaxe", "item stalwart_dungeons:tungsten_axe", "item stalwart_dungeons:tungsten_shovel", "item stalwart_dungeons:tungsten_hoe"]
recompenses = ["xp 8"]
description = """
Épée, pioche, hache, pelle et houe de tungstène.
"""

[[quete]]
cle = "chorundum_armure"
titre = "L'armure de chorundum"
deps = ["shelterer", "tungstene_armure"]
taches = ["item stalwart_dungeons:chorundum_armor_helmet", "item stalwart_dungeons:chorundum_armor_chestplate", "item stalwart_dungeons:chorundum_armor_leggings", "item stalwart_dungeons:chorundum_armor_boots"]
recompenses = ["xp 15"]
description = """
Le chorundum, et le &lcristal du vide&r que lâche le Shelterer (table de butin du jar) dans chaque pièce. Le dernier palier de Stalwart Dungeons ; chaque pièce est à l'Armurerie de l'Encyclopédie.
"""

[[quete]]
cle = "chorundum_outils"
titre = "Les outils de chorundum"
deps = ["tungstene_outils"]
taches = ["item stalwart_dungeons:chorundum_sword", "item stalwart_dungeons:chorundum_pickaxe", "item stalwart_dungeons:chorundum_axe", "item stalwart_dungeons:chorundum_shovel", "item stalwart_dungeons:chorundum_hoe"]
recompenses = ["xp 12"]
description = """
Le minerai de chorundum, fondu, et un bâton.
"""

[[quete]]
cle = "awful_ghast_relance"
titre = "&cUn autre Awful Ghast"
deps = ["awful_ghast"]
boss = true
forme = "gear"
taille = 1.3
taches = ["kill stalwart_dungeons:awful_ghast"]
recompenses = ["xp 20"]
description = """
Un autre combat, dans un autre donjon. Seul un combat mené après l'ouverture de cette quête compte.
"""

[[quete]]
cle = "nether_keeper_relance"
titre = "&cUn autre Nether Keeper"
deps = ["nether_keeper"]
boss = true
forme = "gear"
taille = 1.3
taches = ["kill stalwart_dungeons:nether_keeper"]
recompenses = ["xp 20"]
description = """
Un autre combat, dans un autre château. Seul un combat mené après l'ouverture de cette quête compte.
"""

[[quete]]
cle = "shelterer_relance"
titre = "&5Un autre Shelterer"
deps = ["shelterer"]
boss = true
forme = "gear"
taille = 1.3
taches = ["kill stalwart_dungeons:shelterer"]
recompenses = ["xp 20"]
description = """
Un autre combat, dans un autre donjon de l'End. Seul un combat mené après l'ouverture de cette quête compte.
"""

[[quete]]
cle = "invoker_relance"
titre = "&6Un autre Invoker"
deps = ["invoker"]
boss = true
forme = "gear"
taille = 1.3
taches = ["kill illagerinvasion:invoker"]
recompenses = ["xp 20"]
description = """
Il revient dans les raids. Seul un combat mené après l'ouverture de cette quête compte.
"""

[[quete]]
cle = "fin"
titre = "&8Chasseur de donjons"
deps = ["wda_fort", "chorundum_armure", "chorundum_outils", "awful_ghast_relance", "nether_keeper_relance", "shelterer_relance", "invoker_relance"]
taille = 1.5
forme = "diamond"
icone = "stalwart_dungeons:tungsten_sword"
taches = ["checkmark Un donjon vidé"]
recompenses = ["xp 5"]
description = """
Le fort des illageois, l'équipement de chorundum, et chaque boss de donjon battu deux fois. Le chapitre &7Chasseur de boss&r des Défis compte tous les boss du serveur.
"""
