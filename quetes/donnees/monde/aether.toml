# chanceToSpawn 0.01).
[[quete]]
cle = "four_holystone"
titre = "Un four en holystone"
deps = ["holystone"]
optionnel = true
taches = ["item ascended_quark:holystone_furnace"]
recompenses = ["xp 3"]
description = """
&bAscended Quark&r porte les ajouts de Quark dans l'Aether. Son four en holystone brûle aussi l'ambrosium comme combustible.
"""

[[quete]]
cle = "pickarang_valkyrie"
