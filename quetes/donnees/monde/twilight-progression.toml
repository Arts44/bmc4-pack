# Chapitre « Twilight Forest — la progression » — cahier des charges §4.6
# Sources (5 octobre 2026) : progrès du jar twilightforest-1.20.1-4.3.2508
# (data/twilightforest/advancements : parents et critères lus, pas déduits),
# descriptions des progrès (en_us.json), twilightforest-common.toml du
# serveur (boss_drop_chests = true : le butin des boss va dans un coffre à
# l'endroit où le boss est apparu ; disableUncrafting = true ;
# shouldReturnPortalBeUsable = true), règle de jeu tfEnforcedProgression =
# true (console du serveur, 5 octobre).
#
# Ordre réel des progrès (parents dans le jar) :
#   root → progress_naga → progress_lich
#   progress_lich → progress_labyrinth (manger le stroganoff) → progress_hydra
#   progress_lich → progress_trophy_pedestal → progress_knights → ghast_trap → progress_ur_ghast
#   progress_lich → progress_yeti → progress_glacier
#   progress_merge (hydre + ur-ghast + reine) → troll / beanstalk → giants → progress_troll → progression_end
# Le Minoshroom n'est pas un progrès de progression : le labyrinthe se
# valide en mangeant le stroganoff de Meef, qu'il lâche.

[chapitre]
titre = "&2Twilight Forest — la progression"
fichier = "monde_twilight_progression"
groupe = "monde"
icone = "twilightforest:naga_trophy"
ordre = 8

[[quete]]
cle = "portail"
titre = "&2Le portail de la Twilight Forest"
sous_titre = "Guide dans #twilight-forest sur le Discord."
taille = 1.5
icone = "twilightforest:twilight_portal_miniature_structure"
taches = ["advancement twilightforest:root"]
recompenses = ["item minecraft:diamond 1"]
description = """
Un bassin d'eau de 2×2 entouré de fleurs, un &bdiamant&r jeté dedans, un éclair. La progression de la forêt est &lverrouillée par ses boss&r sur ce serveur : un biome dont le boss précédent n'est pas tombé inflige des malus. Le butin des boss va dans un &lcoffre&r posé là où le boss est apparu (config du serveur), et le portail de retour est utilisable sans objet.

Sur Mac : désactive les shaders près des portails, ils font planter le jeu.
"""

# ---- Naga
[[quete]]
cle = "cour_naga"
titre = "La cour de la Naga"
deps = ["portail"]
taches = ["structure twilightforest:naga_courtyard"]
recompenses = ["xp 5"]
description = """
Une cour de nagastone dans la forêt. La &2Naga&r y tourne ; c'est le premier boss, et rien d'autre n'est accessible avant elle.
"""

[[quete]]
cle = "naga"
titre = "&2Vaincre la Naga"
deps = ["cour_naga"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["advancement twilightforest:progress_naga"]
recompenses = ["xp 15"]
description = """
Un serpent géant qui charge ; les pilonnes de la cour le ralentissent. Sa mort lève la barrière magique de la tour de la Liche (texte du progrès). Ses écailles font un plastron et des jambières. Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "trophee_naga"
titre = "Le trophée de la Naga"
deps = ["naga"]
taches = ["item twilightforest:naga_trophy"]
recompenses = ["xp 5"]
description = """
Dans le coffre du boss. Les trophées ouvrent le bastion des Gobelins, et décorent.
"""

# ---- Liche
[[quete]]
cle = "tour_liche"
titre = "La tour de la Liche"
deps = ["naga"]
taches = ["structure twilightforest:lich_tower"]
recompenses = ["xp 5"]
description = """
Une tour de brique dans la forêt, pleine de tomes de la mort et de boucliers. La &5Liche&r est au sommet.
"""

[[quete]]
cle = "liche"
titre = "&5Vaincre la Liche"
deps = ["tour_liche"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["advancement twilightforest:progress_lich"]
recompenses = ["xp 20"]
description = """
Une seule Liche est réelle ; les autres sont des clones d'ombre, invulnérables. Casse d'abord ses &lsix boucliers&r : chaque coup en retire un, une boule de neige suffit. Puis les sceptres : vie, zombie, fortification, Twilight. Le progrès du mod dit que sa mort chasse les moustiques du marais, la malédiction de la forêt sombre et le froid de la forêt enneigée.
"""

[[quete]]
cle = "trophee_liche"
titre = "Le trophée de la Liche"
deps = ["liche"]
taches = ["item twilightforest:lich_trophy"]
recompenses = ["xp 5"]
description = """
Dans le coffre du boss. Les quatre sceptres de pouvoir valent un progrès à part.
"""

# ---- Labyrinthe et Minoshroom
[[quete]]
cle = "labyrinthe"
titre = "Le labyrinthe du marais"
deps = ["liche"]
taches = ["structure twilightforest:labyrinth"]
recompenses = ["xp 5"]
description = """
Sous le marais : des minotaures, des slimes de labyrinthe, des coffres par joueur. La salle du &cMinoshroom&r est à l'étage &linférieur&r. La pioche Mazebreaker dort dans la chambre forte secrète.
"""

[[quete]]
cle = "minoshroom"
titre = "&cVaincre le Minoshroom"
deps = ["labyrinthe"]
boss = true
forme = "diamond"
taches = ["kill twilightforest:minoshroom"]
recompenses = ["xp 15"]
description = """
Un minotaure-champignon à la hache. Il lâche le &6Stroganoff de Meef&r : c'est en le mangeant que la progression passe, pas en le tuant.
"""

[[quete]]
cle = "stroganoff"
titre = "Manger le Stroganoff de Meef"
deps = ["minoshroom"]
taches = ["advancement twilightforest:progress_labyrinth"]
recompenses = ["xp 10"]
description = """
Le progrès du mod : « manger le Stroganoff de Meef pour acclimater le corps à la chaleur du Marais du feu ». Sans lui, le marais brûle.
"""

# ---- Hydre
[[quete]]
cle = "repaire_hydre"
titre = "Le repaire de l'Hydre"
deps = ["stroganoff"]
taches = ["structure twilightforest:hydra_lair"]
recompenses = ["xp 5"]
description = """
Une colline creuse dans le Marais du feu. Trois têtes, puis plus.
"""

[[quete]]
cle = "hydre"
titre = "&cVaincre l'Hydre"
deps = ["repaire_hydre"]
boss = true
forme = "diamond"
taille = 1.5
taches = ["advancement twilightforest:progress_hydra"]
recompenses = ["xp 25"]
description = """
Frappe dans la gueule ouverte, esquive le feu et les mortiers. Son sang ardent fait les lingots ardents (épée, pioche, armure : progrès « fiery set »), et une tranche d'Hydre mangée affamé vaut un progrès. Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "trophee_hydre"
titre = "Le trophée de l'Hydre"
deps = ["hydre"]
taches = ["item twilightforest:hydra_trophy"]
recompenses = ["xp 5"]
description = """
Dans le coffre du boss.
"""

# ---- Bastion et Chevaliers fantômes
[[quete]]
cle = "piedestal"
titre = "Un trophée sur le piédestal"
deps = ["liche"]
taches = ["advancement twilightforest:progress_trophy_pedestal"]
recompenses = ["xp 8"]
description = """
Dans les ruines de la forêt sombre, un &lpiédestal à trophée&r à l'entrée du bastion des Gobelins : y poser un trophée de boss dissout les boucliers. Il faut avoir vaincu la Liche (parent du progrès).
"""

[[quete]]
cle = "bastion"
titre = "Le bastion des Gobelins"
deps = ["piedestal"]
taches = ["structure twilightforest:knight_stronghold"]
recompenses = ["xp 5"]
description = """
Gobelins chevaliers, golems de carminite, et la tombe des &7Chevaliers fantômes&r.
"""

[[quete]]
cle = "chevaliers"
titre = "&7Vaincre les Chevaliers fantômes"
deps = ["bastion"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["advancement twilightforest:progress_knights"]
recompenses = ["xp 20"]
description = """
Tous les fantômes de la tombe, jusqu'au dernier (progrès « kill all phantoms »). Leur butin ne va pas dans un coffre, contrairement aux autres boss (config du serveur). Ensuite, les dispositifs de la tour de carminite t'obéissent.
"""

[[quete]]
cle = "trophee_chevaliers"
titre = "Le trophée des Chevaliers fantômes"
deps = ["chevaliers"]
taches = ["item twilightforest:knight_phantom_trophy"]
recompenses = ["xp 5"]
description = """
Pris dans la tombe. Le métal de chevalier fait une armure, un bouclier et une boucle.
"""

# ---- Tour sombre et Ur-Ghast
[[quete]]
cle = "tour_sombre"
titre = "La tour sombre"
deps = ["chevaliers"]
taches = ["structure twilightforest:dark_tower"]
recompenses = ["xp 5"]
description = """
Dans la forêt sombre : du towerwood, des ghastlings et ghastguards de carminite, des pièges. Au sommet, un &lpiège à Ghast&r.
"""

[[quete]]
cle = "piege_ghast"
titre = "Activer le piège à Ghast"
deps = ["tour_sombre"]
taches = ["advancement twilightforest:ghast_trap"]
recompenses = ["xp 8"]
description = """
Tuer les ghastlings autour du piège, puis l'activer pour arracher l'&cUr-Ghast&r au ciel (texte du progrès).
"""

[[quete]]
cle = "ur_ghast"
titre = "&cVaincre l'Ur-Ghast"
deps = ["piege_ghast"]
boss = true
forme = "diamond"
taille = 1.5
taches = ["advancement twilightforest:progress_ur_ghast"]
recompenses = ["xp 25"]
description = """
Un ghast géant qui pleure des larmes rouges. Toucher ses larmes ardentes est le progrès. Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "trophee_ur_ghast"
titre = "Le trophée de l'Ur-Ghast"
deps = ["ur_ghast"]
taches = ["item twilightforest:ur_ghast_trophy"]
recompenses = ["xp 5"]
description = """
Dans le coffre du boss.
"""

# ---- Yéti et Reine des Neiges
[[quete]]
cle = "grotte_yeti"
titre = "La grotte du Yéti"
deps = ["liche"]
taches = ["structure twilightforest:yeti_cave"]
recompenses = ["xp 5"]
description = """
Dans la forêt enneigée, accessible une fois la Liche vaincue. Le &fYéti Alpha&r y lance de la glace.
"""

[[quete]]
cle = "yeti"
titre = "&fVaincre le Yéti Alpha"
deps = ["grotte_yeti"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["advancement twilightforest:progress_yeti"]
recompenses = ["xp 20"]
description = """
Sa fourrure double les vêtements contre le froid du Glacier (texte du progrès) : l'armure de Yéti ouvre la suite.
"""

[[quete]]
cle = "trophee_yeti"
titre = "Le trophée du Yéti Alpha"
deps = ["yeti"]
taches = ["item twilightforest:alpha_yeti_trophy"]
recompenses = ["xp 5"]
description = """
Dans le coffre du boss.
"""

[[quete]]
cle = "palais"
titre = "Le palais des aurores"
deps = ["yeti"]
taches = ["structure twilightforest:aurora_palace"]
recompenses = ["xp 5"]
description = """
Sur le Glacier, un palais de glace. La &bReine des Neiges&r au sommet, protégée par ses cœurs de glace.
"""

[[quete]]
cle = "reine"
titre = "&bVaincre la Reine des Neiges"
deps = ["palais"]
boss = true
forme = "diamond"
taille = 1.5
taches = ["advancement twilightforest:progress_glacier"]
recompenses = ["xp 25"]
description = """
Casse ses cœurs de glace quand elle se pose. Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "trophee_reine"
titre = "Le trophée de la Reine des Neiges"
deps = ["reine"]
taches = ["item twilightforest:snow_queen_trophy"]
recompenses = ["xp 5"]
description = """
Dans le coffre du boss.
"""

# ---- Hautes terres
[[quete]]
cle = "merge"
titre = "&6Les trois piliers"
deps = ["hydre", "ur_ghast", "reine"]
taille = 1.3
taches = ["advancement twilightforest:progress_merge"]
recompenses = ["xp 15"]
description = """
Hydre, Ur-Ghast et Reine des Neiges vaincus : la pluie acide des Hautes terres cesse (texte du progrès). Les grottes des trolls et le haricot magique s'ouvrent.
"""

[[quete]]
cle = "trolls"
titre = "La grotte des trolls"
deps = ["merge"]
taches = ["advancement twilightforest:troll"]
recompenses = ["xp 8"]
description = """
Tuer un troll dans sa grotte (progrès du mod). On y trouve les &aharicots magiques&r.
"""

[[quete]]
cle = "geants"
titre = "Les géants des nuages"
deps = ["trolls"]
taches = ["advancement twilightforest:giants"]
recompenses = ["xp 10"]
description = """
Des haricots magiques sur le sol lumineux sous les nuages, un géant mineur tué là-haut, et sa pioche de géant ramenée aux grottes (textes des progrès).
"""

[[quete]]
cle = "lampe"
titre = "La Lampe de cendres"
deps = ["geants"]
taches = ["advancement twilightforest:progress_troll"]
recompenses = ["xp 10"]
description = """
Dans les grottes des trolls, la &6Lampe de cendres&r brûle les barrières d'épines (texte du progrès). Elle ouvre le Plateau final.
"""

[[quete]]
cle = "plateau"
titre = "&6Le Plateau final"
deps = ["lampe"]
boss = true
forme = "diamond"
taille = 1.5
taches = ["advancement twilightforest:progression_end"]
recompenses = ["xp 20"]
description = """
Le château final se dresse là. Le mod le dit lui-même : « tout ce qui est au-delà est en travaux, à finir dans une future version ». Y arriver est la fin de la progression actuelle.
"""

[[quete]]
cle = "fin"
titre = "&2Seigneur de la forêt"
deps = ["plateau"]
taille = 1.5
icone = "twilightforest:lich_trophy"
taches = ["checkmark Tous les trophées sont chez moi"]
recompenses = ["xp 10"]
description = """
Sept boss, sept trophées, une lampe. Le chapitre &7Exploration&r de la Twilight Forest reste à remplir : collines creuses, clairière des quêtes, arbres magiques.
"""
