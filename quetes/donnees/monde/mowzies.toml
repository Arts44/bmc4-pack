# Chapitre « Mowzie's Mobs » — cahier des charges §4.11
# Sources (5 octobre 2026) : progrès et descriptions du jar mowziesmobs-1.8.2,
# structures de l'index (frostmaw_spawn, umvuthana_grove, wrought_chamber,
# monastery), mowziesmobs-common.toml du serveur (biome_tags des boss,
# liste blanche de la Naga sur les Côtes rocheuses), générateurs du Bluff
# dans les pièces du monastère (scan NBT).

[chapitre]
titre = "&6Mowzie's Mobs"
fichier = "monde_mowzies"
groupe = "monde"
icone = "mowziesmobs:wrought_helmet"
ordre = 11

[[quete]]
cle = "intro"
titre = "&6Les géants de Mowzie's"
sous_titre = "Guide dans #mowzies-mobs sur le Discord."
taille = 1.5
icone = "mowziesmobs:sol_visage"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Quatre boss à leur place dans le monde — le Wroughtnaut ferreux, le Frostmaw, Umvuthi, le Sculpteur — et des créatures qui valent le détour. La &lNaga de Mowzie's&r est un oiseau-serpent des Côtes rocheuses : rien à voir avec la Naga de la Twilight Forest (boss) ni celle de Better Nether.
"""

[[quete]]
cle = "chambre"
titre = "La chambre du Wroughtnaut"
deps = ["intro"]
taches = ["structure mowziesmobs:wrought_chamber"]
recompenses = ["xp 5"]
description = """
Une salle souterraine, partout sauf sous les océans (config du serveur). Le &7Wroughtnaut ferreux&r y est immobile tant qu'on n'entre pas.
"""

[[quete]]
cle = "wroughtnaut"
titre = "&7Vaincre le Wroughtnaut ferreux"
deps = ["chambre"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["advancement mowziesmobs:kill_ferrous_wroughtnaut"]
recompenses = ["xp 20"]
description = """
Son armure ne cède que par derrière. Il lâche son casque et la Hache des mille métaux. Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "frostmaw"
titre = "&bVaincre le Frostmaw"
deps = ["intro"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["advancement mowziesmobs:kill_frostmaw"]
recompenses = ["xp 20"]
description = """
Un colosse endormi dans les biomes enneigés, hors océans, rivières, plages, forêts et taïgas (config du serveur). Il garde un &bcristal de glace&r : le lui voler sans le réveiller est un progrès du mod. Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "bosquet"
titre = "Le bosquet des Umvuthana"
deps = ["intro"]
taches = ["structure mowziesmobs:umvuthana_grove"]
recompenses = ["xp 5"]
description = """
Dans la savane. Les Umvuthana portent des masques (peur, rage, misère, extase, fureur, foi) ; avec un masque, on entre déguisé (progrès du mod). &6Umvuthi&r trône au centre.
"""

[[quete]]
cle = "umvuthi"
titre = "&6Vaincre Umvuthi"
deps = ["bosquet"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["advancement mowziesmobs:kill_umvuthi"]
recompenses = ["xp 20"]
description = """
Il appelle des soigneurs à chaque palier de vie perdu (config du serveur). Lui apporter &lsept blocs d'or&r vaut la Bénédiction du Soleil (config, progrès). Il lâche le Visage du Sol, qui invoque des Umvuthana à partir de masques (infobulle). Sa mort est annoncée dans #faits-d-armes.
"""

[[quete]]
cle = "monastere"
titre = "Le monastère du Sculpteur"
deps = ["intro"]
taches = ["structure mowziesmobs:monastery"]
recompenses = ["xp 5"]
description = """
Sur les pics (config du serveur). Tongbi, le &7Sculpteur&r, propose une &lépreuve d'escalade&r contre un bâton de Bluff. Le monastère cache aussi deux générateurs de &7Bluff&r.
"""

[[quete]]
cle = "sculpteur"
titre = "&7L'épreuve du Sculpteur"
deps = ["monastere"]
boss = true
forme = "diamond"
taille = 1.3
taches = ["advancement mowziesmobs:sculptor_challenge"]
recompenses = ["xp 20"]
description = """
Soixante blocs à grimper en moins de 400 secondes (config du serveur). Échouer vaut l'autre progrès, moins glorieux. Le Sculpteur disparaît une fois la récompense réclamée (config).
"""

[[quete]]
cle = "foliaath"
titre = "Un Foliaath"
deps = ["intro"]
optionnel = true
taches = ["advancement mowziesmobs:kill_foliaath"]
recompenses = ["xp 5"]
description = """
Une plante carnivore des jungles. Sa graine se plante dans l'herbe ; le bébé a faim chaque demi-journée et grandit en deux jours (infobulle).
"""

[[quete]]
cle = "grottol"
titre = "Un Grottol"
deps = ["intro"]
optionnel = true
taches = ["advancement mowziesmobs:kill_grottol"]
recompenses = ["xp 5"]
description = """
Une créature de cristal des grottes, sous Y 16, qui fuit. À la pioche &lsoie&r, on le capture ; à la pioche &lfortune&r, il lâche plus (progrès du mod).
"""

[[quete]]
cle = "naga"
titre = "La Naga des Côtes rocheuses"
deps = ["intro"]
optionnel = true
taches = ["advancement mowziesmobs:kill_naga"]
recompenses = ["xp 5"]
description = """
Sur les Côtes rocheuses seulement (liste blanche de la config du serveur). Sa dent fait une dague qui empoisonne et double les dégâts par derrière (infobulle).
"""

# Mowzie's × Cataclysm 1.2.1 : recettes du jar ; FrostmawEyeItem (javap)
# lance un Eye_Of_Dungeon_Entity de Cataclysm vers la structure de la balise
# *_eye_located (wrought_chamber, frostmaw_spawn, monastery, umvuthana_grove).
[[quete]]
cle = "yeux"
titre = "Les yeux de Cataclysm"
deps = ["intro"]
optionnel = true
exigence = "une"
taches = ["item mowzies_cataclysm:wrought_eye", "item mowzies_cataclysm:frostmaw_eye", "item mowzies_cataclysm:sun_eye", "item mowzies_cataclysm:tongbi_eye"]
recompenses = ["xp 5"]
description = """
Un œil de l'Ender au centre d'une recette, et le lancer file vers un repaire de Mowzie's, comme les yeux de Cataclysm. L'« Eye of Wrought » mène à la chambre du Wroughtnaut, l'« Eye of Frost » au Frostmaw, l'« Eye of the Sunbird » au bosquet d'Umvuthana, l'« Eye of the Sculptor » au monastère.
"""

[[quete]]
cle = "wrought_butin"
titre = "La hache et le casque"
deps = ["wroughtnaut"]
taches = ["item mowziesmobs:wrought_axe", "item mowziesmobs:wrought_helmet"]
recompenses = ["xp 8"]
description = """
Les deux pièces de sa table de butin : la hache et le casque du Wroughtnaut.
"""

[[quete]]
cle = "wrought_relance"
titre = "&7Un autre Wroughtnaut"
deps = ["wrought_butin"]
boss = true
forme = "gear"
taille = 1.3
taches = ["kill mowziesmobs:ferrous_wroughtnaut"]
recompenses = ["xp 20"]
description = """
Chaque chambre forgée a son Wroughtnaut. Trouve-en une autre et recommence : seul un combat mené après cette quête compte.
"""

[[quete]]
cle = "frostmaw_cristal"
titre = "Le cristal de glace"
deps = ["frostmaw"]
taches = ["item mowziesmobs:ice_crystal"]
recompenses = ["xp 8"]
description = """
Le cristal du Frostmaw, dans sa table de butin. Le lui voler sans le tuer vaut un progrès à part.
"""

[[quete]]
cle = "frostmaw_vol"
titre = "Voler le cristal"
deps = ["frostmaw"]
optionnel = true
taches = ["advancement mowziesmobs:steal_ice_crystal"]
recompenses = ["xp 8"]
description = """
Prendre le cristal à un Frostmaw sans le tuer (progrès du mod).
"""

[[quete]]
cle = "frostmaw_relance"
titre = "&bUn autre Frostmaw"
deps = ["frostmaw_cristal"]
boss = true
forme = "gear"
taille = 1.3
taches = ["kill mowziesmobs:frostmaw"]
recompenses = ["xp 20"]
description = """
Un autre Frostmaw, ailleurs dans le froid. Seul un combat mené après cette quête compte.
"""

[[quete]]
cle = "masque"
titre = "Un masque d'Umvuthana"
deps = ["bosquet"]
exigence = "une"
taches = ["item mowziesmobs:umvuthana_mask_fury", "item mowziesmobs:umvuthana_mask_fear", "item mowziesmobs:umvuthana_mask_rage", "item mowziesmobs:umvuthana_mask_bliss", "item mowziesmobs:umvuthana_mask_misery", "item mowziesmobs:umvuthana_mask_faith"]
recompenses = ["xp 5"]
description = """
Six masques, sur les Umvuthana ou dans les coffres du bosquet.
"""

[[quete]]
cle = "deguise"
titre = "Déguisé dans le bosquet"
deps = ["masque"]
optionnel = true
taches = ["advancement mowziesmobs:sneak_grove"]
recompenses = ["xp 5"]
description = """
Entrer dans un bosquet d'Umvuthana déguisé (progrès du mod).
"""

[[quete]]
cle = "raptor"
titre = "Le Raptor"
deps = ["bosquet"]
taches = ["advancement mowziesmobs:kill_umvuthana_raptor"]
recompenses = ["xp 8"]
description = """
Le chef des Umvuthana d'un bosquet (progrès du mod).
"""

[[quete]]
cle = "visage"
titre = "Le Visage du Sol"
deps = ["umvuthi"]
taches = ["item mowziesmobs:sol_visage"]
recompenses = ["xp 8"]
description = """
Le masque d'Umvuthi, dans sa table de butin.
"""

[[quete]]
cle = "benediction"
titre = "La Bénédiction du Soleil"
deps = ["umvuthi"]
optionnel = true
taches = ["advancement mowziesmobs:suns_blessing"]
recompenses = ["xp 10"]
description = """
Sept blocs d'or apportés à Umvuthi (config du serveur).
"""

[[quete]]
cle = "umvuthi_relance"
titre = "&6Un autre Umvuthi"
deps = ["visage", "raptor"]
boss = true
forme = "gear"
taille = 1.3
taches = ["kill mowziesmobs:umvuthi"]
recompenses = ["xp 20"]
description = """
Chaque bosquet a son Umvuthi. Seul un combat mené après cette quête compte.
"""

[[quete]]
cle = "gantelet"
titre = "Le Gantelet fendeur de terre"
deps = ["sculpteur"]
taches = ["item mowziesmobs:earthrend_gauntlet"]
recompenses = ["xp 10"]
description = """
La récompense du défi du Sculpteur (table de butin sculptor_test du jar).
"""

[[quete]]
cle = "geomancien"
titre = "La tenue du géomancien"
deps = ["monastere"]
optionnel = true
taches = ["item mowziesmobs:geomancer_beads", "item mowziesmobs:geomancer_robe", "item mowziesmobs:geomancer_belt", "item mowziesmobs:geomancer_sandals", "item mowziesmobs:sculptor_staff"]
recompenses = ["xp 10"]
description = """
Perles, robe, ceinture, sandales et bâton du Sculpteur : dans les coffres du monastère ou sur le Sculpteur lui-même.
"""

[[quete]]
cle = "fin"
titre = "&6Les quatre géants"
deps = ["wrought_relance", "frostmaw_relance", "umvuthi_relance", "gantelet"]
taille = 1.5
forme = "diamond"
icone = "mowziesmobs:earthrend_gauntlet"
taches = ["checkmark Les quatre sont tombés"]
recompenses = ["xp 10"]
description = """
Wroughtnaut, Frostmaw et Umvuthi battus deux fois, le défi du Sculpteur relevé. Le casque du Wroughtnaut, sa hache, le Visage du Sol et le Gantelet fendeur de terre sont &lincassables&r sur ce serveur (config).
"""
