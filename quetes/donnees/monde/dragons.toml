# Chapitre « Les dragons » — cahier des charges §4.13
# Sources (5 octobre 2026) : dragonmounts-common.toml du serveur lu en
# entier (allow_egg_override = true : l'œuf de l'Ender s'interagit et
# éclôt ; replenish_eggs = true, mais sans effet : le mixin de YUNG's Better
# End Island sur setDragonKilled annule la méthode avant celui de Dragon
# Mounts, et sa config « Resummoned Dragon Drops Egg » est à false ; use_loot_tables = true avec les chances
# ci-dessous ; update_habitats = true ; reproduction : deux fois par race
# de base ; souffle à 3,0 de dégâts, portée 40 ; rayon d'errance 8),
# lang du jar dragonmounts-1.20.1-10018 (36 races, « Hatches in %s
# seconds », l'œuf change de race selon son milieu), patch-dragonmounts/
# LISEZ-MOI.md (jar serveur patché : 25 % d'hybride, sinon une des deux
# races parentes), dragons.js du bot (salon #dragons, « !dragon <x> <y> <z>
# <race> [pseudo] [dimension] » : le bot vérifie l'œuf, le retire et fait
# apparaître le dragon), dragonloot-common du serveur (3 écailles garanties
# sur l'Ender Dragon + 2 tirages par joueur à 80 %, enclume sans plafond),
# progrès dragonloot:dragon_armor ; datapack bmc4-fixes (load.mcfunction : équipe
# bmc4_dragons, friendlyFire false ; tick.mcfunction : tout dragon y entre).
# Paliers (BMC-89, 5 octobre) : races et habitats lus dans
# data/dragonmounts/dragonmounts/dragon_breeds et tags/blocks/*_habitat_blocks ;
# œuf = dragonmounts:dragon_egg, NBT BlockEntityTag.Breed (tâche oeuf_dragon) ;
# croisements : 28 fichiers bmc4-fixes/data/bmc4/dragonmounts/cross_breeding
# du serveur (copie dans config/datapack) ; reproduction : pond un œuf de la
# race de l'enfant (TameableDragon, javap) ; armure du dragon : blocs de
# cuivre (4), or (6), fer (8), émeraude (10), diamant (12), nétherite (16)
# (DragonArmorType, noms résolus par les correspondances mcp_config) ; selle
# et coffre. DragonLoot : arc, arbalète, trident, armure de cheval et
# plastron ailé par recettes générées (CompatRecipes, RecipeManagerMixin).

[chapitre]
titre = "&5Les dragons"
fichier = "monde_dragons"
groupe = "monde"
icone = "dragonloot:dragon_scale"
ordre = 13

[[quete]]
cle = "intro"
titre = "&5Dragon Mounts: Legacy"
sous_titre = "Guide dans #dragons sur le Discord."
taille = 1.5
icone = "dragonloot:dragon_scale"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Trente-six races de dragons dans le pack : les huit de base — feu, eau, forêt, glace, fantôme, Nether, End, Aether — et vingt-huit de l'extension : orage, solaire, lunaire, éclipse, sculk, Wither, zombie, cristal, jade, sang, ombre, lumière… Un dragon se monte, vole, et souffle (3 de dégâts sur 40 blocs, config du serveur). En patrouille, il reste à 8 blocs de son poste.
"""

[[quete]]
cle = "oeuf"
titre = "Un œuf de dragon"
racine = true
taches_une = true
taches = ["oeuf_dragon fire", "oeuf_dragon forest", "oeuf_dragon ghost", "oeuf_dragon ice", "oeuf_dragon nether", "oeuf_dragon water", "oeuf_dragon aether", "oeuf_dragon end", "item minecraft:dragon_egg", "observation entity dragonmounts:dragon"]
recompenses = ["xp 5"]
description = """
Les œufs des huit races de base sont dans les coffres (config du serveur) : Aether dans les donjons (6 %), feu dans les temples du désert (5 %), forêt dans les temples de la jungle (10 %), fantôme dans les manoirs (7 %) et les mines (5 %), glace dans les igloos (7 %), Nether dans les trésors des bastions (10 %), eau dans les trésors enfouis (7 %). L'œuf de l'Ender Dragon compte aussi, mais il n'y en a qu'un : un dragon ré-invoqué n'en laisse pas sur ce serveur (Better End Island, dont le code passe avant celui de Dragon Mounts).

Tu as déjà un dragon et plus d'œuf ? &lRegarde ton dragon&r : la quête accepte l'œuf &lou&r la vue d'un dragon, et le reste du chapitre s'ouvre.
"""

[[quete]]
cle = "eclosion"
titre = "Faire éclore"
deps = ["oeuf"]
taille = 1.3
taches = ["observation entity dragonmounts:dragon"]
recompenses = ["xp 8"]
description = """
Sur BMC4, l'éclosion passe par le bot. Pose l'œuf, relève ses coordonnées avec &lF3&r en le regardant, puis poste dans &9#dragons&r : &l!dragon <x> <y> <z> <race>&r (pseudo et dimension en option).

Le bot cherche l'œuf &lposé&r aux coordonnées données, le retire et fait apparaître à côté un dragon &ladulte et déjà apprivoisé&r. Attention : c'est l'œuf qui décide de la race, pas celle que tu tapes. La quête se valide en regardant un dragon.
"""

[[quete]]
cle = "apprivoiser"
titre = "Apprivoiser et seller"
deps = ["oeuf"]
doublon_voulu = true
taches = ["item minecraft:saddle"]
recompenses = ["xp 5"]
description = """
Le bébé se nourrit et grandit ; adulte, une &lselle&r (chapitre &aAgriculture&r des bases) et il se monte. Tous les dragons du serveur sont dans une même équipe sans tir allié (datapack du serveur) : le souffle d'un dragon ne lance plus de bagarre avec un autre.
"""

[[quete]]
cle = "monter"
titre = "Monter un dragon"
deps = ["apprivoiser"]
taches = ["checkmark J'ai volé"]
recompenses = ["xp 10"]
description = """
Vol libre, souffle à la touche du mod. Aucune tâche ne sait voir un joueur en selle sur un dragon : celle-ci se coche. Le Moa de l'Aether, les élytres et les jetpacks sont les autres façons de voler.
"""

