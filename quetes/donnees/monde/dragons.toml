# Chapitre « Les dragons » — cahier des charges §4.13
# Sources (5 octobre 2026) : dragonmounts-common.toml du serveur lu en
# entier (allow_egg_override = true : l'œuf de l'Ender s'interagit et
# éclôt ; replenish_eggs = true ; use_loot_tables = true avec les chances
# ci-dessous ; update_habitats = true ; reproduction : deux fois par race
# de base ; souffle à 3,0 de dégâts, portée 40 ; rayon d'errance 8),
# lang du jar dragonmounts-1.20.1-10018 (36 races, « Hatches in %s
# seconds », l'œuf change de race selon son milieu), patch-dragonmounts/
# LISEZ-MOI.md (jar serveur patché : 25 % d'hybride, sinon une des deux
# races parentes), dragons.js du bot (salon #dragons, « !dragon <x> <y> <z>
# <race> [pseudo] [dimension] » : le bot vérifie l'œuf, le retire et fait
# apparaître le dragon), dragonloot-common du serveur (3 écailles garanties
# sur l'Ender Dragon + 2 tirages par joueur à 80 %, enclume sans plafond),
# progrès dragonloot:dragon_armor ; datapack bmc4-fixes (load.mcfunction : équipe
# bmc4_dragons, friendlyFire false ; tick.mcfunction : tout dragon y entre).

[chapitre]
titre = "&5Les dragons"
fichier = "monde_dragons"
groupe = "monde"
icone = "dragonloot:dragon_scale"
ordre = 13

[[quete]]
cle = "intro"
titre = "&5Dragon Mounts: Legacy"
sous_titre = "Guide dans #dragons sur le Discord."
taille = 1.5
icone = "dragonloot:dragon_scale"
taches = ["checkmark Lu"]
recompenses = ["xp 2"]
description = """
Trente-six races de dragons dans le pack : les huit de base — feu, eau, forêt, glace, fantôme, Nether, End, Aether — et vingt-huit de l'extension : orage, solaire, lunaire, éclipse, sculk, Wither, zombie, cristal, jade, sang, ombre, lumière… Un dragon se monte, vole, et souffle (3 de dégâts sur 40 blocs, config du serveur). En patrouille, il reste à 8 blocs de son poste.
"""

[[quete]]
cle = "oeuf"
titre = "Un œuf de dragon"
deps = ["intro"]
taches = ["checkmark Un œuf en poche"]
recompenses = ["xp 5"]
description = """
Les œufs sont dans les coffres (config du serveur) : Aether dans les donjons (6 %), feu dans les temples du désert (5 %), forêt dans les temples de la jungle (10 %), fantôme dans les manoirs (7 %) et les mines (5 %), glace dans les igloos (7 %), Nether dans les trésors des bastions (10 %), eau dans les trésors enfouis (7 %). L'œuf de l'Ender Dragon compte aussi : il se renouvelle sur le portail après chaque dragon ré-invoqué (config).
"""

[[quete]]
cle = "eclosion"
titre = "Faire éclore"
deps = ["oeuf"]
taille = 1.3
taches = ["checkmark Un dragon est né"]
recompenses = ["xp 8"]
description = """
Posé, l'œuf couve et l'infobulle compte les secondes. Il &lchange de race selon son milieu&r (config : les habitats sont actifs) — un œuf posé dans la neige donne un dragon de glace.

Autre voie : dans &9#dragons&r, poste &l!dragon <x> <y> <z> <race>&r (pseudo et dimension en option). Le bot vérifie que tu as l'œuf, le retire, et fait apparaître le dragon à la position donnée.
"""

[[quete]]
cle = "apprivoiser"
doublon_voulu = true
titre = "Apprivoiser et seller"
deps = ["eclosion"]
taches = ["item minecraft:saddle"]
recompenses = ["xp 5"]
description = """
Le bébé se nourrit et grandit ; adulte, une &lselle&r (chapitre &aAgriculture&r des bases) et il se monte. Tous les dragons du serveur sont dans une même équipe sans tir allié (datapack du serveur) : le souffle d'un dragon ne lance plus de bagarre avec un autre.
"""

[[quete]]
cle = "monter"
titre = "Monter un dragon"
deps = ["apprivoiser"]
taches = ["checkmark J'ai volé"]
recompenses = ["xp 10"]
description = """
Vol libre, souffle à la touche du mod. Le Moa de l'Aether, les élytres et les jetpacks sont les autres façons de voler.
"""

[[quete]]
cle = "races"
titre = "Une race de l'extension"
deps = ["eclosion"]
optionnel = true
taches = ["checkmark Un dragon hors des huit races de base"]
recompenses = ["xp 5"]
description = """
Orage, solaire, lunaire, éclipse, sculk, Wither, zombie, cristal, bronze, Nether primordial, End primordial, monarque, aîné… Vingt-huit races au-delà des huit de base (lang du mod).
"""

[[quete]]
cle = "croisement"
titre = "Un croisement hybride"
deps = ["apprivoiser"]
optionnel = true
taches = ["checkmark Croisement tenté"]
recompenses = ["xp 8"]
description = """
Deux dragons adultes de races différentes peuvent donner un &lhybride&r. Sur BMC4, le jar du serveur est patché : &l25 % de chance&r d'obtenir la race hybride, sinon l'une des deux races parentes. Chaque race de base ne se reproduit que &ldeux fois&r (config du serveur).
"""

[[quete]]
cle = "ecailles"
titre = "Des écailles de dragon"
deps = ["intro"]
optionnel = true
taches = ["item dragonloot:dragon_scale 3"]
recompenses = ["xp 5"]
description = """
&5DragonLoot&r : l'Ender Dragon lâche au moins trois écailles, plus deux tirages par joueur présent (config du serveur). Elles font une armure, des outils et l'&lenclume de dragon&r, sans plafond de niveaux sur ce serveur.
"""

[[quete]]
cle = "armure"
titre = "L'armure de dragon"
deps = ["ecailles"]
optionnel = true
taches = ["advancement dragonloot:dragon_armor"]
recompenses = ["xp 15"]
description = """
Les quatre pièces : progrès « Des écailles de la bête ».
"""

[[quete]]
cle = "hangar"
titre = "Un hangar"
deps = ["apprivoiser"]
optionnel = true
taches = ["checkmark Mes dragons ont un toit"]
recompenses = ["xp 3"]
description = """
Un dragon en patrouille reste à 8 blocs (config) : un hangar dans le claim le garde à l'abri.
"""

[[quete]]
cle = "fin"
titre = "&5Dragonnier"
deps = ["monter"]
taille = 1.3
icone = "dragonloot:dragon_helmet"
taches = ["checkmark Dragonnier"]
recompenses = ["xp 5"]
description = """
Un dragon à soi, sellé, dans son hangar.
"""
