recompenses = ["xp 8"]
description = """
Deux dragons adultes de races de base différentes pondent un œuf. Sur BMC4, le serveur a une table de vingt-huit croisements (un par paire de races de base) et son jar est patché : &l25 % de chance&r que l'œuf soit de la race hybride, sinon de l'une des deux races parentes. Chaque race ne se reproduit qu'un nombre limité de fois (config du serveur). Pour faire éclore un œuf hybride, même chemin qu'au début du chapitre : pose-le et passe par &l!dragon&r dans #dragons.
"""

