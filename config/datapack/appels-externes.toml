# Fonctions de bmc4-fixes lancées de l'extérieur (BMC-90, 6 octobre 2026) —
# lu par quetes/outils/controle_datapack.py.
#
# Le datapack du dépôt est une copie octet pour octet de celui du serveur
# (/world/datapacks/bmc4-fixes) : les raisons vivent ici plutôt qu'en
# commentaire dans les fonctions. Exception en attente de déploiement : les
# trois corrections BMC-90 du 6 octobre (raid_debut, raid_tick, raid_fin,
# tick, spectateur_sortie), les rangs de prestige BMC-91 (rangs/, load, tick,
# raid_fin) et le repeuplement des animaux relancé par load (bmc4_anim),
# préparés dans le dépôt, pas encore sur le serveur. Chaque raison vient de
# l'en-tête de la fonction ou d'un appel trouvé dans le code du bot ; rien
# n'est supposé.

[fonction]
# Le bot (discord-factions, raids.js) les lance par RCON.
"bmc4:raid_debut" = "ouverture du créneau : raids.js l'appelle par RCON après avoir rempli l'équipe bmc4_raid_actif"
"bmc4:raid_fin" = "fermeture du créneau : raids.js (conclureRaid) l'appelle par RCON"

# Le Marché Flottant (BMC-09), construit une fois à la console.
