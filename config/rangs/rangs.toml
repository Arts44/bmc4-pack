# Les commandes de FTB Essentials ouvertes par rang (numéro du rang à partir
# duquel la commande est donnée). Lu par FTB Ranks (nœuds command.*) et par
# KubeJS (message « /x s'obtient au rang … »).
[commandes]
hat = 2
home = 2
sethome = 2
delhome = 2
listhomes = 2
trashcan = 3
nickname = 4
feed = 6
enderchest = 7
back = 8
tpa = 10
tpahere = 10
# Accepter ou refuser une demande reste ouvert à tous : sans ça, un Céleste ne
# pourrait demander qu'à un autre Céleste. Les blocages s'appliquent quand même.
tpaccept = 0
tpdeny = 0

# Nombre de homes par rang (le plus haut rang acquis l'emporte).
[homes]
2 = 1
5 = 2
7 = 3
10 = 4
13 = 5
14 = 6

# Délais entre deux téléportations, en secondes, appliqués par KubeJS (ceux
# de FTB Essentials sont mis à 0 : son message est en anglais).
[delais]
home = 10
back = 30
tpa = 10

# Les auras : /trigger bmc4_aura set <n>. Les numéros 1 à 6 viennent au rang
# Diamant (5), le 7 est l'aura exclusive du rang Divin (14).
# /trigger bmc4_aura set 10 coupe l'aura.
[[aura]]
nom = "Étincelles d'enchantement"
particule = "minecraft:enchant ~ ~1 ~ 0.4 0.6 0.4 0.4 6"
rang = 5

[[aura]]
nom = "Bâtons de l'End"
particule = "minecraft:end_rod ~ ~1 ~ 0.4 0.6 0.4 0.01 2"
rang = 5

[[aura]]
nom = "Flammes d'âme"
particule = "minecraft:soul_fire_flame ~ ~0.2 ~ 0.3 0.1 0.3 0.01 2"
rang = 5

[[aura]]
nom = "Pétales de cerisier"
particule = "minecraft:cherry_leaves ~ ~1.8 ~ 0.4 0.2 0.4 0 2"
rang = 5

[[aura]]
nom = "Lueurs"
particule = "minecraft:glow ~ ~1 ~ 0.4 0.6 0.4 0 2"
rang = 5

[[aura]]
nom = "Notes"
particule = "minecraft:note ~ ~2.2 ~ 0.3 0 0.3 1 1"
rang = 5

[[aura]]
nom = "Halo divin"
particule = "minecraft:dust 1.0 0.85 0.3 1.0 ~ ~2.1 ~ 0.25 0 0.25 0 4"
rang = 14
