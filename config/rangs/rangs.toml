# Rangs de prestige BMC4 (BMC-91, 6 octobre 2026) — source unique.
#
# Échelle arrêtée avec Arthur. Tout le reste en est tiré par
# config/rangs/generer.py : fonctions du datapack (achat, kits, équipes,
# messages), ranks.snbt de FTB Ranks, table des rangs de KubeJS, rangs.json du
# bot, chapitre « Rangs » du livre. Modifier ici, puis :
#
#     python3 config/rangs/generer.py
#
# Coûts en NIVEAUX d'XP, retirés au moment de l'achat. Un rang s'achète après
# le précédent ; on garde tous les rangs achetés.
#
# couleur : couleur du préfixe, en hexadécimal (rendue en jeu dans le chat,
#   la liste Tab et au-dessus de la tête) ;
# nom_couleur : couleur du pseudo, une des seize couleurs nommées de Minecraft
#   (une équipe n'accepte pas l'hexadécimal pour le pseudo) ;
# banniere : l'étendard décoratif du kit.

[infini]
nom = "Infini"
symbole = "∞"
couleur = "#C77DFF"
nom_couleur = "light_purple"
gras = true
cout_depart = 10000
hausse = 2500
paliers = 30
banniere = "minecraft:magenta_banner"
kit = ["minecraft:firework_rocket 16"]

[[rang]]
nom = "Cuivre"
article = "du"
symbole = "⬩"
couleur = "#E07B39"
